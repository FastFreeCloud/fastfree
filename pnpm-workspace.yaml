packages:
  # 3 core apps (installer, backend, website) + 10 modular packages.
  # fastfree_os is the NixOS/Clan flake (no package.json); fastfree_panel is
  # the Clan panel SPA + its private Node backend (packages/*/backend glob).
  - 'packages/*'
  - 'packages/*/backend'
  - 'packages/*/server'
  - 'apps/*'
  # The MCP server that renders documentation HTML. A workspace member so its
  # @modelcontextprotocol/sdk stays pinned in the shared lockfile and is
  # installed by `pnpm install` at the repo root.
  - 'tools/*'
allowBuilds:
  '@parcel/watcher': true
  # apps/fastfree_website uses @tailwindcss/postcss; oxide ships a native binary
  # that its postinstall unpacks.
  '@tailwindcss/oxide': true
  bufferutil: true
  core-js: true
  cypress: true
  # electron arrives only as a transitive dep of @vue/devtools-electron.
  # Its postinstall downloads a ~100 MB binary that nothing here uses, and
  # @vue/devtools falls back to the browser build, so deny the build script
  # rather than pay for it on every install.
  electron: false
  electron-winstaller: true
  esbuild: true
  lightningcss: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  vue-demi: true
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@vitejs/plugin-vue@6.0.11'
overrides:
  # vite declares sass-embedded as an OPTIONAL peer and pnpm auto-installs optional
  # peers, so sass-embedded lands in the tree. Its prebuilt dart-sass binary cannot
  # exec on NixOS and the compiler socket dies with EPIPE mid-run, taking the whole
  # dev server down. Point the name at the pure-JS sass package: Vite only uses
  # the import and compileString entry points, which sass provides, and the
  # optional peer now resolves to a working implementation.
  sass-embedded: "npm:sass@^1.80.0"
  vue-router: 5.2.0
  pinia: 4.0.2
  sass: ^1.80.0
