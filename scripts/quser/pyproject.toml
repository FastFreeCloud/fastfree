[project]
name = "quser"
version = "0.1.0"
description = "quser backend: HoloolHIS flow-up scraper (ICU/CCU/NICU/NEO/Stroke) exposed as CLI + API"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "playwright>=1.62.0",
    "fastapi>=0.118,<0.142",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0",
    "filelock>=3.13",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
