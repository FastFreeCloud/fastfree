<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="FastFree OS">
  <defs>
    <linearGradient id="fo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="fo-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fo-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#a78bfa" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fo-bg)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fo-dots)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fo-glow)"/>
  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>

  <g stroke="#a78bfa" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="330" x2="740" y2="330"/>
    <line x1="120" y1="40" x2="120" y2="380"/>
    <line x1="680" y1="40" x2="680" y2="380"/>
  </g>

  <g transform="translate(400 195)" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"/>
    <path d="M-38 -18 L-18 2 L-38 22" stroke-width="5"/>
    <line x1="-8" y1="22" x2="30" y2="22" stroke-width="5"/>
    <line x1="0" y1="-90" x2="0" y2="-120" opacity="0.6"/>
    <line x1="78" y1="45" x2="108" y2="62" opacity="0.6"/>
    <line x1="-78" y1="45" x2="-108" y2="62" opacity="0.6"/>
    <circle cx="0" cy="-120" r="5" fill="#030712"/>
    <circle cx="108" cy="62" r="5" fill="#030712"/>
    <circle cx="-108" cy="62" r="5" fill="#030712"/>
  </g>

  <g transform="translate(400 322)">
    <circle cx="0" cy="0" r="26" fill="#030712" stroke="#a78bfa" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#a78bfa">OS</text>
  </g>

  <text x="400" y="425" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="40" font-weight="700" fill="#a78bfa">FastFree OS</text>
  <text x="400" y="473" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0">فاست فري أو إس</text>
