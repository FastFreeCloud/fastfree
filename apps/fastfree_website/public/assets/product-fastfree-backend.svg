  <text x="400" y="425" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="40" font-weight="700" fill="#34d399">FastFree Backend</text>
  <text x="400" y="473" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0">فاست فري باك إند</text>
