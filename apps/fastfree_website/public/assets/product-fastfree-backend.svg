  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>

  <g stroke="#34d399" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="330" x2="740" y2="330"/>
    <line x1="120" y1="40" x2="120" y2="380"/>
    <line x1="680" y1="40" x2="680" y2="380"/>
  </g>

  <g transform="translate(400 195)" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -85 L120 -35 L0 15 L-120 -35 Z"/>
    <path d="M-120 -15 L0 35 L120 -15" opacity="0.75"/>
    <path d="M-120 15 L0 65 L120 15" opacity="0.5"/>
