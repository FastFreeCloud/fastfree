<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Cairo, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#f57c00" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#f57c00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f57c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealglow" cx="0.2" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#0dcaf0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0dcaf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0dcaf0" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#tealglow)"/>

  <rect x="18" y="18" width="1164" height="594" rx="16" fill="none" stroke="#0dcaf0" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#f57c00" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(80,120)">
    <circle cx="60" cy="60" r="60" fill="#f57c00" fill-opacity="0.10" stroke="#f57c00" stroke-opacity="0.55" stroke-width="1.5"/>
    <g fill="none" stroke="#f57c00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(28,28)">
      <rect x="6" y="4" width="52" height="64" rx="6"/>
      <line x1="6" y1="20" x2="58" y2="20"/>
      <line x1="16" y1="32" x2="48" y2="32"/>
      <line x1="16" y1="44" x2="48" y2="44"/>
      <line x1="16" y1="56" x2="34" y2="56"/>
      <circle cx="48" cy="56" r="4"/>
    </g>
  </g>

  <text x="80" y="300" fill="#0dcaf0" font-size="22" letter-spacing="2">F A S T F R E E · مقال</text>
  <text x="80" y="360" fill="#f57c00" font-size="46" font-weight="700">كيف تختار برنامج المحاسبة</text>
  <text x="80" y="418" fill="#f57c00" font-size="46" font-weight="700">المناسب لشركتك في مصر</text>
  <text x="80" y="470" fill="#e5e7eb" fill-opacity="0.85" font-size="20">دليل عملي لاختيار النظام المالي الأنسب لنشاطك</text>

  <g transform="translate(930,400)" stroke="#0dcaf0" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M0,0 L60,0 L60,80 L0,80 Z"/>
    <line x1="0" y1="40" x2="60" y2="40"/>
    <line x1="30" y1="0" x2="30" y2="80"/>
  </g>
</svg>
