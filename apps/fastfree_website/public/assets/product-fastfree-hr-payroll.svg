<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="FastFree HR and Payroll">
  <defs>
    <linearGradient id="fh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="fh-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#fb923c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fh-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fb923c" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fh-bg)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fh-dots)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fh-glow)"/>
  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#fb923c" stroke-opacity="0.35" stroke-width="1.5"/>

  <g stroke="#fb923c" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="330" x2="740" y2="330"/>
    <line x1="120" y1="40" x2="120" y2="380"/>
    <line x1="680" y1="40" x2="680" y2="380"/>
  </g>

  <g transform="translate(400 195)" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-55" cy="-30" r="24"/>
    <path d="M-110 70 C-110 22 0 22 0 70"/>
    <rect x="25" y="-20" width="100" height="90" rx="8"/>
    <line x1="40" y1="0" x2="110" y2="0" opacity="0.7"/>
    <line x1="40" y1="18" x2="110" y2="18" opacity="0.45"/>
    <circle cx="55" cy="46" r="10" opacity="0.8"/>
    <line x1="72" y1="40" x2="110" y2="40" opacity="0.7"/>
    <line x1="72" y1="54" x2="110" y2="54" opacity="0.45"/>
  </g>

  <g transform="translate(400 322)">
    <circle cx="0" cy="0" r="26" fill="#030712" stroke="#fb923c" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fb923c">HR</text>
  </g>

  <text x="400" y="425" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="40" font-weight="700" fill="#fb923c">FastFree HR &amp; Payroll</text>
  <text x="400" y="473" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0">فاست فري الموارد البشرية والرواتب</text>
