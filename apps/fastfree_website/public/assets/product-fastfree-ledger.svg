<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="FastFree Ledger">
  <defs>
    <linearGradient id="fl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="fl-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fl-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#22d3ee" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fl-bg)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fl-dots)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fl-glow)"/>
  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5"/>

  <g stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="330" x2="740" y2="330"/>
    <line x1="120" y1="40" x2="120" y2="380"/>
    <line x1="680" y1="40" x2="680" y2="380"/>
  </g>

  <g transform="translate(400 195)" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-120" y="-85" width="240" height="170" rx="12"/>
    <line x1="-120" y1="-45" x2="120" y2="-45"/>
    <circle cx="-96" cy="-65" r="4" fill="#22d3ee" stroke="none"/>
    <circle cx="-78" cy="-65" r="4" fill="#22d3ee" stroke="none" opacity="0.55"/>
    <line x1="-120" y1="-5" x2="120" y2="-5" opacity="0.55"/>
    <line x1="-120" y1="35" x2="120" y2="35" opacity="0.55"/>
    <line x1="-40" y1="-45" x2="-40" y2="85" opacity="0.55"/>
    <path d="M-100 65 L-55 35 L-20 52 L35 20 L100 38" stroke-width="3"/>
    <circle cx="100" cy="38" r="5" fill="#030712"/>
  </g>

  <g transform="translate(400 322)">
