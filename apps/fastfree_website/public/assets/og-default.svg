<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FastFree">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f57c00"/>
      <stop offset="1" stop-color="#0dcaf0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- accent bars -->
  <rect x="0" y="0" width="14" height="630" fill="#f57c00"/>
  <rect x="14" y="0" width="6" height="630" fill="#0dcaf0"/>

  <!-- glow -->
  <circle cx="980" cy="120" r="220" fill="#0dcaf0" fill-opacity="0.08"/>
  <circle cx="220" cy="540" r="200" fill="#f57c00" fill-opacity="0.10"/>

  <!-- wordmark -->
  <text x="90" y="300" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-2" fill="url(#wordmark)">FastFree</text>

  <!-- taglines -->
  <text x="94" y="378" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="46" font-weight="600" fill="#f57c00" direction="rtl" text-anchor="start">حلول برمجية للشركات</text>
  <text x="94" y="436" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="40" font-weight="500" fill="#cbd5e1">Business software that fits</text>

  <!-- footer line -->
  <text x="94" y="560" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="30" font-weight="400" fill="#0dcaf0">fastfree.cloud</text>
</svg>
