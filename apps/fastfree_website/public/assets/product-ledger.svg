<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="FastFree Ledger">
  <defs>
    <linearGradient id="led-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="led-glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#f57c00" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#f57c00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f57c00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="led-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0dcaf0" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#led-bg)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#led-dots)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#led-glow)"/>
  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#0dcaf0" stroke-opacity="0.35" stroke-width="1.5"/>

