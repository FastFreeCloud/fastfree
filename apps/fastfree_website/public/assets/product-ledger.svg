    <rect x="-110" y="-60" width="220" height="150" rx="12" stroke="#f57c00"/>
    <line x1="-110" y1="-22" x2="110" y2="-22" stroke="#0dcaf0"/>
    <line x1="-40" y1="-22" x2="-40" y2="90" stroke="#0dcaf0" stroke-opacity="0.6"/>
    <line x1="40" y1="-22" x2="40" y2="90" stroke="#0dcaf0" stroke-opacity="0.6"/>
    <line x1="-110" y1="22" x2="110" y2="22" stroke="#0dcaf0" stroke-opacity="0.6"/>
    <line x1="-110" y1="56" x2="110" y2="56" stroke="#0dcaf0" stroke-opacity="0.6"/>
    <circle cx="-75" cy="0" r="3" fill="#0dcaf0" stroke="none"/>
    <circle cx="-7" cy="0" r="3" fill="#0dcaf0" stroke="none"/>
    <circle cx="61" cy="0" r="3" fill="#0dcaf0" stroke="none"/>
    <path d="M-95 40 L-50 12 L-15 34 L40 6 L95 28" stroke="#0dcaf0" stroke-width="3"/>
