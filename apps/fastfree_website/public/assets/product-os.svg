<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="FastFree OS">
  <defs>
    <linearGradient id="os-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="os-glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#f57c00" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#0dcaf0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0dcaf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="os-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0dcaf0" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#os-bg)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#os-dots)"/>
  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#os-glow)"/>
  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#0dcaf0" stroke-opacity="0.35" stroke-width="1.5"/>

  <g transform="translate(400 210)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-70" x2="-150" y2="40" stroke="#0dcaf0" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="0" y1="-70" x2="150" y2="40" stroke="#0dcaf0" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="-150" y1="40" x2="150" y2="40" stroke="#0dcaf0" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#0dcaf0" stroke-width="2.5" stroke-opacity="0.6"/>

    <circle cx="0" cy="-70" r="34" stroke="#f57c00" stroke-width="4"/>
    <path d="M-14 -82 a18 18 0 0 1 28 0" stroke="#f57c00" stroke-width="3"/>
    <path d="M0 -92 l0 -14" stroke="#f57c00" stroke-width="3"/>

    <circle cx="-150" cy="40" r="30" stroke="#0dcaf0" stroke-width="4"/>
    <rect x="-150" y="28" width="32" height="24" rx="4" transform="translate(-16 0)" stroke="#0dcaf0" stroke-width="3"/>

    <circle cx="150" cy="40" r="30" stroke="#0dcaf0" stroke-width="4"/>
    <rect x="150" y="28" width="32" height="24" rx="4" transform="translate(-16 0)" stroke="#0dcaf0" stroke-width="3"/>

    <circle cx="0" cy="70" r="30" stroke="#f57c00" stroke-width="4"/>
    <path d="M-16 70 h32 M0 54 v32" stroke="#f57c00" stroke-width="3"/>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="40" font-weight="700" fill="#f57c00">FastFree OS</text>
  <text x="400" y="488" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="30" font-weight="600" fill="#0dcaf0">فاست فري أو إس</text>
</svg>
