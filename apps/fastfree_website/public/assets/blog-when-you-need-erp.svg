  <text x="80" y="300" fill="#f57c00" font-size="22" letter-spacing="2">F A S T F R E E · مقال</text>
  <text x="80" y="356" fill="#0dcaf0" font-size="42" font-weight="700">متى تحتاج شركتك إلى نظام ERP؟</text>
  <text x="80" y="410" fill="#0dcaf0" font-size="42" font-weight="700">علامات أنك تجاوزت جداول البيانات</text>
  <text x="80" y="464" fill="#e5e7eb" fill-opacity="0.85" font-size="20">الإشارات التي تدل على حاجة نموّك لنظام متكامل</text>

  <g transform="translate(930,400)" stroke="#f57c00" stroke-opacity="0.5" stroke-width="2" fill="none">
