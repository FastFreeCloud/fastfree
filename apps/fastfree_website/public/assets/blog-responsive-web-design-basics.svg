<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.26" r="0.55">
      <stop offset="0" stop-color="#f57c00" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#f57c00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f57c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealglow" cx="0.2" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#0dcaf0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0dcaf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#0dcaf0" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#tealglow)"/>

  <rect x="18" y="18" width="1164" height="594" rx="16" fill="none" stroke="#0dcaf0" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#f57c00" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(80,110)">
    <circle cx="60" cy="60" r="60" fill="#f57c00" fill-opacity="0.10" stroke="#f57c00" stroke-opacity="0.55" stroke-width="1.5"/>
    <g fill="none" stroke="#f57c00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(26,28)">
      <rect x="0" y="0" width="68" height="46" rx="4"/>
      <line x1="0" y1="14" x2="68" y2="14"/>
      <line x1="14" y1="27" x2="40" y2="27"/>
      <line x1="14" y1="38" x2="54" y2="38"/>
    </g>
  </g>

  <text x="80" y="296" fill="#0dcaf0" font-size="22" letter-spacing="2">F A S T F R E E</text>
  <text x="80" y="352" fill="#f57c00" font-size="42" font-weight="700">Responsive Web Design</text>
  <text x="80" y="406" fill="#f57c00" font-size="42" font-weight="700">Basics</text>
  <text x="80" y="460" fill="#e5e7eb" fill-opacity="0.85" font-size="20">Mobile-first, content-based breakpoints</text>

  <g transform="translate(980,420)" fill="none" stroke="#0dcaf0" stroke-opacity="0.5" stroke-width="2">
    <rect x="0" y="30" width="36" height="26" rx="3"/>
    <rect x="30" y="18" width="44" height="38" rx="3" stroke="#f57c00" stroke-opacity="0.5"/>
    <line x1="18" y1="30" x2="18" y2="56"/>
    <line x1="52" y1="18" x2="52" y2="56"/>
  </g>

  <g transform="translate(80,500)">
    <rect x="0" y="0" width="222" height="34" rx="17" fill="#0dcaf0" fill-opacity="0.12" stroke="#0dcaf0" stroke-opacity="0.55" stroke-width="1"/>
    <text x="111" y="23" fill="#0dcaf0" font-size="17" letter-spacing="1" text-anchor="middle">WEB_DEVELOPMENT</text>
  </g>
