<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Cairo, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.26" r="0.55">
      <stop offset="0" stop-color="#f57c00" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#f57c00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f57c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealglow" cx="0.2" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#0dcaf0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0dcaf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#0dcaf0" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#tealglow)"/>

  <rect x="18" y="18" width="1164" height="594" rx="16" fill="none" stroke="#0dcaf0" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#f57c00" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(80,120)">
    <circle cx="60" cy="60" r="60" fill="#f57c00" fill-opacity="0.10" stroke="#f57c00" stroke-opacity="0.55" stroke-width="1.5"/>
    <g fill="none" stroke="#f57c00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(28,28)">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="52" cy="12" r="10"/>
      <circle cx="32" cy="52" r="10"/>
      <line x1="19" y1="19" x2="45" y2="19"/>
      <line x1="16" y1="20" x2="27" y2="45"/>
      <line x1="48" y1="20" x2="37" y2="45"/>
    </g>
  </g>

  <text x="80" y="300" fill="#0dcaf0" font-size="22" letter-spacing="2">F A S T F R E E · مقال</text>
  <text x="80" y="358" fill="#f57c00" font-size="44" font-weight="700">إدارة عدة فروع ومستودعات</text>
  <text x="80" y="414" fill="#f57c00" font-size="44" font-weight="700">من نظام واحد</text>
  <text x="80" y="468" fill="#e5e7eb" fill-opacity="0.85" font-size="20">توحيد التحكم والرؤية على كل مواقع عملك</text>

  <g transform="translate(940,400)" stroke="#0dcaf0" stroke-opacity="0.5" stroke-width="2" fill="none">
    <circle cx="10" cy="10" r="8"/>
    <circle cx="70" cy="10" r="8"/>
    <circle cx="40" cy="70" r="8"/>
    <line x1="16" y1="14" x2="64" y2="14"/>
    <line x1="14" y1="16" x2="34" y2="64"/>
    <line x1="66" y1="16" x2="46" y2="64"/>
  </g>
