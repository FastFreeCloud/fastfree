<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#0dcaf0" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#0dcaf0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0dcaf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldglow" cx="0.18" cy="0.82" r="0.5">
      <stop offset="0" stop-color="#f57c00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f57c00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#0dcaf0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#goldglow)"/>

  <rect x="18" y="18" width="1164" height="594" rx="16" fill="none" stroke="#f57c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#0dcaf0" stroke-opacity="0.25" stroke-width="1"/>

  <text x="80" y="82" fill="#f57c00" font-size="30" font-weight="700" letter-spacing="1">FastFree</text>

  <g transform="translate(80,108)">
    <rect x="0" y="0" width="78" height="30" rx="15" fill="#0dcaf0" fill-opacity="0.14" stroke="#0dcaf0" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="39" y="20" fill="#0dcaf0" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">TIPS</text>
  </g>

  <text x="80" y="220" fill="#ffffff" font-size="40" font-weight="700">Basic Data Security for</text>
  <text x="80" y="272" fill="#ffffff" font-size="40" font-weight="700">Small Businesses</text>
  <text x="80" y="322" fill="#e5e7eb" fill-opacity="0.85" font-size="20">Role-based permissions, backups, and secure VPN access</text>

  <g transform="translate(900,360)">
    <circle cx="80" cy="80" r="80" fill="#0dcaf0" fill-opacity="0.10" stroke="#0dcaf0" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(46,40)" fill="none" stroke="#0dcaf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34,8 L58,18 L58,40 C58,56 46,66 34,68 C22,66 10,56 10,40 L10,18 Z"/>
      <path d="M26,32 L32,38 L44,24" stroke="#f57c00"/>
    </g>
  </g>
