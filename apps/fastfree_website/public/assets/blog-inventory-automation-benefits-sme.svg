  <rect x="18" y="18" width="1164" height="594" rx="16" fill="none" stroke="#f57c00" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#0dcaf0" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(80,120)">
