  </g>

  <text x="400" y="425" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="36" font-weight="700" fill="#e879f9">FastFree Reporting &amp; Analytics</text>
  <text x="400" y="473" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0">فاست فري التقارير والتحليلات</text>
