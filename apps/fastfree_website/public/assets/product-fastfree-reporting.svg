  <rect x="0" y="0" width="800" height="600" rx="18" fill="url(#fr-glow)"/>
  <rect x="6" y="6" width="788" height="588" rx="14" fill="none" stroke="#e879f9" stroke-opacity="0.35" stroke-width="1.5"/>

  <g stroke="#e879f9" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="330" x2="740" y2="330"/>
    <line x1="120" y1="40" x2="120" y2="380"/>
    <line x1="680" y1="40" x2="680" y2="380"/>
  </g>

  <g transform="translate(400 195)" fill="none" stroke="#e879f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-55" cy="10" r="62"/>
