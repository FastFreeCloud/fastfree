    <rect x="35" y="30" width="26" height="45" rx="4" fill="#e879f9" fill-opacity="0.22"/>
    <rect x="69" y="5" width="26" height="70" rx="4" fill="#e879f9" fill-opacity="0.22"/>
    <rect x="103" y="-25" width="26" height="100" rx="4" fill="#e879f9" fill-opacity="0.22"/>
