# ╔══════════════════════════════════════════════════════════════════╗
# ║            FastFree — Production Docker Compose                ║
# ║                                                                ║
# ║  Deployment: Portainer GitOps (stack.env in git repo)          ║
# ║  Webhook: Auto redeploy on git push                            ║
# ║                                                                ║
# ║  Services:                                                     ║
# ║    1. fastfree_db        — MySQL 8.0 Database                  ║
# ║    2. fastfree_phpmyadmin — phpMyAdmin (db.fastfree.cloud)     ║
# ║    3. fastfree_web       — Next.js Application                 ║
# ║    4. fastfree_proxy     — Caddy Reverse Proxy (HTTPS)         ║
# ║                                                                ║
# ║  Network: fastfree_network (10.0.0.0/24)                      ║
# ╚══════════════════════════════════════════════════════════════════╝

# Portainer reads variables from stack.env in git repo
# Override values in Portainer UI → Stack Details → Environment Variables

services:

  # ── 1. MySQL Database ───────────────────────────────────────────
  fastfree_db:
    image: mysql:8.0
    container_name: fastfree_db
    environment:
      MYSQL_ROOT_PASSWORD: FastFree@Secure2026!
      MYSQL_DATABASE: fastfree
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      fastfree_network:
        ipv4_address: 10.0.0.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 2. phpMyAdmin ───────────────────────────────────────────────
  fastfree_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fastfree_phpmyadmin
    environment:
      PMA_HOST: fastfree_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: FastFree@Secure2026!
    ports:
      - "8080:80"
    depends_on:
      fastfree_db:
        condition: service_healthy
    networks:
      fastfree_network:
        ipv4_address: 10.0.0.11
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── 3. Next.js Web Application ──────────────────────────────────
  fastfree_web:
    image: ghcr.io/fastfreecloud/fastfree_web:latest
    container_name: fastfree_web
    command: node server.js
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:FastFree@Secure2026!@fastfree_db:3306/fastfree
      - JWT_SECRET=ff-jwt-a7b3c9d2e4f6081523476a9bce0df1247890abcdef1234567890fedcba987654
      - ADMIN_EMAIL=admin@fastfree.cloud
      - ADMIN_PASSWORD=FastFree@Admin2026!
      - APP_URL=https://fastfree.cloud
      - NODE_ENV=production
    depends_on:
      fastfree_db:
        condition: service_healthy
    networks:
      fastfree_network:
        ipv4_address: 10.0.0.12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── 4. Caddy Reverse Proxy (Automatic HTTPS) ───────────────────
  fastfree_proxy:
    image: caddy:2-alpine
    container_name: fastfree_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDYFILE_CONTENT: |
        fastfree.cloud, www.fastfree.cloud {
            reverse_proxy 10.0.0.12:3000
            log {
                output file /var/log/caddy/fastfree_web.log {
                    roll_size 10mb
                    roll_keep 5
                    roll_keep_for 720h
                }
                format console
                level info
            }
        }
        db.fastfree.cloud {
            reverse_proxy 10.0.0.11:80
            log {
                output file /var/log/caddy/fastfree_pma.log {
                    roll_size 10mb
                    roll_keep 5
                    roll_keep_for 720h
                }
                format console
                level info
            }
        }
    command: >
      sh -c "echo \"$$CADDYFILE_CONTENT\" > /etc/caddy/Caddyfile && 
             caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - fastfree_web
    networks:
      fastfree_network:
        ipv4_address: 10.0.0.13
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Networks ──────────────────────────────────────────────────────
networks:
  fastfree_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  caddy_logs:
