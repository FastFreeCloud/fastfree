<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastFree Node Companion</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .splash-card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 28px 24px;
        background: radial-gradient(circle at 50% 20%, #131F37 0%, #0B1120 65%, #050811 100%);
        border: 1px solid rgba(56, 189, 248, 0.28);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 45px rgba(25, 118, 210, 0.25);
        color: #F8FAFC;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      /* Subtle top specular accent */
      .splash-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 20%;
        right: 20%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.8), transparent);
      }
      .logo-container {
        position: relative;
        width: 88px;
        height: 88px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-glow {
        position: absolute;
        inset: -12px;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.35) 0%, rgba(37, 99, 235, 0.15) 50%, transparent 75%);
        border-radius: 50%;
        animation: pulse-glow 3s infinite ease-in-out;
      }
      .logo-svg {
        position: relative;
        width: 80px;
        height: 80px;
        filter: drop-shadow(0 6px 20px rgba(0, 240, 255, 0.45));
      }
      .brand-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FE 60%, #BAE6FD 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
      }
      .brand-sub {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: #38BDF8;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 3px 12px;
        border-radius: 9999px;
        margin-top: 8px;
        letter-spacing: 0.5px;
      }
      .status-label {
        font-size: 12px;
        color: #94A3B8;
        margin-top: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.25s ease;
      }
      .progress-track {
        width: 240px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        margin-top: 14px;
        overflow: hidden;
        position: relative;
      }
      .progress-bar {
        position: absolute;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #2563EB, #00F0FF, #38BDF8);
        border-radius: 4px;
        animation: sweep 1.8s infinite ease-in-out;
      }
      .footer-badge {
        font-size: 10px;
        color: #64748B;
        margin-top: 16px;
        letter-spacing: 0.6px;
      }

      @keyframes sweep {
        0% { left: -50%; }
        100% { left: 100%; }
      }
      @keyframes pulse-glow {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.18); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="splash-card">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <img class="logo-svg" src="/logo.svg" alt="FastFree Logo" />
      </div>

      <h1 class="brand-title">FastFree Node Companion</h1>
      <div class="brand-sub">Hyper-V Sovereign Edition v26.05</div>

      <div id="statusText" class="status-label">جارٍ فحص صلاحيات النظام ونواة Hyper-V...</div>

      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>

      <div class="footer-badge">Sovereign Enterprise Monorepo Ecosystem</div>
    </div>

    <script>
      const messages = [
        "جارٍ فحص صلاحيات النظام ونواة Hyper-V...",
        "فحص حاويات التخزين وواجهات الشبكة المخصصة...",
        "التحقق من بيئة العتاد وتخصيص الموارد...",
        "بدء تشغيل معالج الإعداد والتثبيت..."
      ];
      let idx = 0;
      const el = document.getElementById("statusText");
      setInterval(() => {
        idx = (idx + 1) % messages.length;
        if (el) {
          el.style.opacity = '0';
          setTimeout(() => {
            el.innerText = messages[idx];
            el.style.opacity = '1';
          }, 200);
        }
      }, 750);
    </script>
  </body>
</html>
