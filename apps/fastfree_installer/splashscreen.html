<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastFree Starting...</title>
    <style>
      body {
        margin: 0;
        background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
        color: #F8FAFC;
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        animation: pulse 2s infinite ease-in-out;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .subtitle {
        font-size: 12px;
        color: #94A3B8;
        margin-top: 6px;
      }
      .loader {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 20px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar {
        position: absolute;
        width: 50%;
        height: 100%;
        background: #1976D2;
        border-radius: 2px;
        animation: loading 1.5s infinite ease-in-out;
      }
      @keyframes loading {
        0% { left: -50%; }
        100% { left: 100%; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="title">FastFree Sovereign Node</div>
    <div class="subtitle">Detecting hardware & initializing installer...</div>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
  </body>
</html>
