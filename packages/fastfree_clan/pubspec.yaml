name: fastfree_clan
description: "FastFree Clan — Nix-backed Clan module (generate/configure/audit Clan files) with a Stac SDUI interface. Uses the official `nix` library schema."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

executables:
  fastfree_clan: cli

dependencies:
  flutter:
    sdk: flutter
  stac: ^1.6.0
  http: ^1.2.0
  args: ^2.4.0
  collection: ^1.19.1
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/fallback/clan_fallback.json
    - assets/fallback/clan_node_discovery.json
    - assets/fallback/clan_modules_catalog.json
    - assets/fallback/clan_vars_secrets.json
    - assets/fallback/clan_mesh_wireguard.json
    - assets/fallback/clan_provisioning_deploy.json
    - assets/fallback/clan_launchpad_dashboard.json
