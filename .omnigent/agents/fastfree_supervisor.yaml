name: fastfree-lead-supervisor
version: "1.2.0"
description: "Master supervisor coordinating 7 specialized subagents with Hindsight persistent memory, OpenCode dual-agent review loop, and zero-cost free model fallbacks"
prompt: |
  You are the FastFree Chief Architect & AI Development Center Lead Supervisor.
  You coordinate complex engineering workflows across modular domain packages, Quasar apps, NixOS infrastructure, and Tauri desktop nodes.
  Decompose high-level engineering goals and delegate to your 7 specialized subagents.
  Always consult Hindsight memory for prior architecture decisions and conventions.
  Follow the 7-phase engineering lifecycle: Understand -> Plan -> Delegate -> Execute -> Test -> Review -> Reflect.

executor:
  harness: claude-sdk
  model: claude-3-7-sonnet
  reasoning_effort: high
  fallback_model: openrouter/google/gemini-2.0-flash-exp:free

tools:
  # 1. Hindsight Long-Term Memory Tools (Sanitized)
  hindsight_recall:
    type: builtin
    bank_id: fastfree-core-memory
    budget: mid
  hindsight_retain:
    type: builtin
    bank_id: fastfree-core-memory
  hindsight_reflect:
    type: builtin
    bank_id: fastfree-core-memory

  # ---------------------------------------------------------
  # 2. Coordinated Subagents Fleet (7 Specialized Agents)
  # ---------------------------------------------------------

  # Subagent 1: Project Architecture & Analysis Specialist
  subagent_architecture:
    type: agent
    spec: .omnigent/agents/subagent_architecture.yaml

  # Subagent 2: NixOS & Nix Flakes Infrastructure Specialist
  subagent_nixos:
    type: agent
    spec: .omnigent/agents/subagent_nixos.yaml

  # Subagent 3: Clan & Sovereign Mesh Infrastructure Engineer
  subagent_clan:
    type: agent
    spec: .omnigent/agents/subagent_clan.yaml

  # Subagent 4: Backend & Frappe Services Specialist
  subagent_backend:
    type: agent
    spec: .omnigent/agents/subagent_backend.yaml

  # Subagent 5: Frontend & Quasar / LowCode Specialist
  subagent_frontend:
    type: agent
    spec: .omnigent/agents/subagent_frontend.yaml

  # Subagent 6: Testing & QA Automation Engineer
  subagent_qa:
    type: agent
    spec: .omnigent/agents/subagent_qa.yaml

  # Subagent 7: Research, Documentation & AI-Rulez Specialist
  subagent_research:
    type: agent
    spec: .omnigent/agents/subagent_research.yaml

  # ---------------------------------------------------------
  # 3. Independent Adversarial Reviewer (OpenCode / DeepSeek R1)
  # ---------------------------------------------------------
  subagent_reviewer:
    type: agent
    prompt: |
      You are an independent adversarial code reviewer running in the OpenCode harness.
      Inspect diffs, run vue-tsc, verify AI-Rulez policies, and issue VERDICT: APPROVE or REJECT.
      Operate with 100% neutrality and strict read-only permissions.
    executor:
      harness: opencode
      model: deepseek-r1
      fallback_model: openrouter/deepseek/deepseek-r1:free
    tools:
      os_env: true
      github_connect: inherit

policies:
  - name: fastfree-change-policy
    rule: "require human approval before modifying .ai-rulez/ or committing to main"
  - name: budget-ceiling
    rule: "pause and alert if session spend exceeds $10.00"
  - name: free-tier-routing
    rule: "route non-critical research and lint checks to free open models when budget < $2.00"
  - name: independent-reviewer-invariant
    rule: "no core change or release accepted without independent sign-off from subagent_reviewer"
