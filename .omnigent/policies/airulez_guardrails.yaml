version: "1.0"
description: "AI-Rulez Guardrails & Security Policies for FastFree Omnigent Runners"

policies:
  - id: airulez-deny-secrets
    target: "tool:fs:read"
    condition: "path.matches('**/.env*') || path.matches('**/*id_rsa*') || path.matches('**/*.keystore') || path.matches('**/*.jks')"
    action: "block"
    reason: "AI-Rulez secure-secrets invariant violation: private credentials must never be read directly by agents"

  - id: airulez-deny-raw-git-reset
    target: "tool:bash:execute"
    condition: "command.startsWith('git reset --hard') || command.startsWith('rm -rf') || command.startsWith('git clean -fdx')"
    action: "block"
    reason: "AI-Rulez invariant violation: destructive operations are forbidden"

  - id: airulez-ask-git-push
    target: "tool:bash:execute"
    condition: "command.startsWith('git push') || command.startsWith('git commit') || command.startsWith('clan vars generate') || command.startsWith('clan vars set')"
    action: "require_approval"
    reason: "AI-Rulez mandatory human approval gate: remote and cryptographic mutations require operator confirmation"

  - id: airulez-protect-customer-fleet
    target: "tool:network:connect"
    condition: "ip.inSubnet('10.0.0.0/8') || ip.inSubnet('172.16.0.0/12') || ip.inSubnet('192.168.0.0/16')"
    action: "block"
    reason: "Air-gap security invariant: runners must never probe customer WireGuard appliances directly"
