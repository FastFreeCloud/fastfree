version: 2
updates:
  # GitHub Actions — weekly scan for action version updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    # Only allow minor and patch updates (ignore major version bumps)
    # Major versions often have breaking changes and need manual review
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # NPM — disabled because Dependabot's npm updater doesn't support
  # pnpm devEngines / packageManager spec correctly (corepack error).
  # Use `pnpm update` or Renovate for npm dependency updates.
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "sunday"
