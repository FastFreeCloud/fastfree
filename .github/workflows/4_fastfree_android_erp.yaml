name: "4_fastfree_android_erp"

###############################################################################
#  _____         _   _____              _____ ____  ____  
# |  ___|_ _ ___| |_|  ___| __ ___  ___| ____|  _ \|  _ \ 
# | |_ / _` / __| __| |_ | '__/ _ \/ _ \  _| | |_) | |_) |
# |  _| (_| \__ \ |_|  _|| | |  __/  __/ |___|  _ <|  __/ 
# |_|  \__,_|___/\__|_|  |_|  \___|\___|_____|_| \_\_|    
#
# FastFree ERP — مسار البناء والنشر المستقل لنظام تخطيط موارد المؤسسات على Android [ملف واحد]
#
# طريقة العمل:
#   1. البناء بيتم بالكامل داخل بيئة GitHub Actions المعزولة على سيرفر ubuntu-24.04.
#   2. تجميع تطبيق Quasar Framework وتهيئته لمحرك Capacitor Android.
#   3. فك تشفير وتثبيت مفتاح التوقيع الرقمي الإنتاجي release.jks المعتمد من Google Play.
#   4. بناء حزمة AAB الموقعة رقمياً للرفع المباشر على متجر Google Play Console.
#   5. بناء حزمة APK الموقعة رقمياً وإرفاقها مع Release رسمي وموثق على GitHub.
#
# معلومات الحزمة والتوقيع:
#   - اسم التطبيق:       FastFree ERP (Enterprise Resource Planning)
#   - معرّف الحزمة:      com.fastfree.erp
#   - مجلد التطبيق:      apps/fastfree_erp
#   - متطلبات SDK:       Android SDK 36 (Compile/Target SDK 36, Min SDK 24)
#   - بصمة المفتاح:      SHA-256: F5:0C:11:D1:C3:44:3E:B3:72:EF:5E:62:E0:16:B5:E5:E2:89:ED:42:48:F6:D3:FB:C8:08:28:A5:0B:97:AD:79
#   - اسم المستعار:      fastfree
#   - مسارات النشر:      Google Play Track (internal / production)
#
# الأسرار المطلوبة (Settings → Secrets and variables → Actions → Secrets):
#   ANDROID_RELEASE_KEYSTORE_BASE64   (أو ANDROID_KEYSTORE_BASE64) محتوى المفتاح بصيغة Base64
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  مفتاح حساب خدمة Google Cloud لنشر Google Play Console
###############################################################################

"on":
  workflow_dispatch:
    inputs:
      track:
        description: "مسار النشر على Google Play (المسار الداخلي أو الإنتاج العام)"
        required: true
        type: choice
        default: "internal"
        options:
          - "internal"
          - "production"
      release_notes:
        description: "ملاحظات الإصدار (أقصى حد 500 حرف لـ Google Play Console)"
        required: false
        type: string
        default: "تحديثات دورية، تحسينات في الأداء وإصلاحات استقرار لنظام تخطيط موارد المؤسسات."

concurrency:
  group: fastfree-android-erp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  APP_NAME: "FastFree ERP"
  APP_KEY: "erp"
  APP_DIR: "apps/fastfree_erp"
  PACKAGE_ID: "com.fastfree.erp"
  NODE_OPTIONS: "--no-deprecation"
  KEYSTORE_PASSWORD: "FastFree@87171393"
  KEY_ALIAS: "fastfree"
  KEY_PASSWORD: "FastFree@87171393"

jobs:
  build-and-deploy:
    name: "بناء وتوقيع ونشر FastFree ERP للأندرويد"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      # ======================= 1. إعداد بيئة Git الآمنة =======================
      - name: "1. إعداد بيئة Git الآمنة"
        run: |
          echo "تهيئة الصلاحيات الآمنة لـ Git داخل بيئة العمل..."
          git config --global safe.directory '*'

      # ======================= 2. استدعاء الكود المصدري =======================
      - name: "2. استدعاء الكود المصدري"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================= 3. إعداد Node.js 22 =======================
      - name: "3. إعداد Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ======================= 4. إعداد Java 21 =======================
      - name: "4. إعداد Java 21"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # ======================= 5. تثبيت حزم Android SDK 36 =======================
      - name: "5. تثبيت حزم Android SDK 36"
        uses: android-actions/setup-android@v3
        with:
          packages: "cmdline-tools;latest platforms;android-36 build-tools;36.0.0"

      # ======================= 6. تثبيت الاعتماديات عبر pnpm =======================
      - name: "6. تثبيت الاعتماديات عبر pnpm"
        run: |
          echo "تثبيت مدير الحزم pnpm (الإصدار 11.11.0)..."
          npm install -g pnpm@11.11.0
          echo "تثبيت اعتماديات المستودع الموحد (Monorepo)..."
          pnpm install --no-frozen-lockfile --ignore-scripts
          if [ -d "${{ env.APP_DIR }}/src-capacitor" ]; then
            echo "تثبيت حزم محرك Capacitor الخاص بالتطبيق..."
            cd "${{ env.APP_DIR }}/src-capacitor" && npm install
          fi

      # ======================= 7. بناء واجهة Quasar =======================
      - name: "7. بناء واجهة Quasar"
        run: |
          echo "تجهيز تطبيق Quasar وبناء أصول الويب لمنصة Capacitor Android..."
          cd "${{ env.APP_DIR }}"
          pnpm exec quasar prepare
          pnpm exec quasar build -m capacitor -T android

      # ======================= 8. مزامنة Capacitor مع Android =======================
      - name: "8. مزامنة Capacitor مع Android"
        run: |
          cd "${{ env.APP_DIR }}/src-capacitor"
          if [ ! -d "android" ]; then
            echo "إضافة منصة أندرويد عبر Capacitor..."
            npx cap add android
          fi
          echo "مزامنة الأكواد والأصول البرمجية مع مشروع أندرويد..."
          npx cap sync android

      # ======================= 9. تجهيز مفتاح التوقيع الرقمي release.jks =======================
      - name: "9. تجهيز مفتاح التوقيع الرقمي release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "=== تجهيز مفتاح التوقيع الرقمي وإعدادات التوقيع لنظام Android ==="
          ANDROID_DIR="${{ env.APP_DIR }}/src-capacitor/android"

          # 1. استخراج أو نسخ مفتاح التوقيع الرقمي release.jks
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "فك تشفير مفتاح التوقيع الرقمي من السر ANDROID_RELEASE_KEYSTORE_BASE64..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_DIR/release.jks"
          elif [ -f ".auth/signing/release.jks" ]; then
            echo "استخدام مفتاح التوقيع الرقمي المحفوظ في المستودع .auth/signing/release.jks..."
            cp ".auth/signing/release.jks" "$ANDROID_DIR/release.jks"
          elif [ -f "scripts/fastfree-android/keystore/release.jks" ]; then
            echo "استخدام مفتاح التوقيع الاحتياطي في scripts/fastfree-android/keystore/release.jks..."
            cp "scripts/fastfree-android/keystore/release.jks" "$ANDROID_DIR/release.jks"
          else
            echo "خطأ حرج: لم يتم العثور على مفتاح التوقيع release.jks!"
            exit 1
          fi

          # 2. إنشاء ملف keystore.properties
          echo "إنشاء ملف خصائص المفتاح keystore.properties..."
          cat << 'EOF' > "$ANDROID_DIR/keystore.properties"
          storeFile=release.jks
          storePassword=${{ env.KEYSTORE_PASSWORD }}
          keyAlias=${{ env.KEY_ALIAS }}
          keyPassword=${{ env.KEY_PASSWORD }}
          EOF
          sed -i 's/^[ \t]*//' "$ANDROID_DIR/keystore.properties"

          # 3. تثبيت إصدارات Android SDK 36 في variables.gradle
          if [ -f "$ANDROID_DIR/variables.gradle" ]; then
            echo "تثبيت Target SDK 36 و Compile SDK 36 في variables.gradle..."
            sed -i -E "s/targetSdkVersion\s*=\s*[0-9]+/targetSdkVersion = 36/" "$ANDROID_DIR/variables.gradle"
            sed -i -E "s/compileSdkVersion\s*=\s*[0-9]+/compileSdkVersion = 36/" "$ANDROID_DIR/variables.gradle"
            sed -i -E "s/minSdkVersion\s*=\s*[0-9]+/minSdkVersion = 24/" "$ANDROID_DIR/variables.gradle"
          fi

          # 4. تشغيل سكريبت الربط والتحقق المعياري إذا توفر
          if [ -f "scripts/fastfree-android/fastfree_android_keystore.py" ]; then
            echo "تشغيل سكريبت الربط المعياري fastfree_android_keystore.py..."
            python3 scripts/fastfree-android/fastfree_android_keystore.py --wire --app-dir "${{ env.APP_KEY }}" || true
          fi

          # 5. التحقق المباشر من وجود signingConfigs داخل app/build.gradle
          BUILD_GRADLE="$ANDROID_DIR/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ] && ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
            echo "حقن كتلة signingConfigs داخل build.gradle..."
            sed -i '/android {/a \
              def keystorePropertiesFile = rootProject.file("keystore.properties")\
              def keystoreProperties = new Properties()\
              if (keystorePropertiesFile.exists()) {\
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
              }\
              signingConfigs {\
                  release {\
                      storeFile rootProject.file(keystoreProperties["storeFile"] ?: "release.jks")\
                      storePassword keystoreProperties["storePassword"]\
                      keyAlias keystoreProperties["keyAlias"]\
                      keyPassword keystoreProperties["keyPassword"]\
                  }\
              }' "$BUILD_GRADLE"
          fi

          if [ -f "$BUILD_GRADLE" ] && ! grep -q "signingConfig signingConfigs.release" "$BUILD_GRADLE"; then
            sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }/' "$BUILD_GRADLE"
          fi

          # 6. منح صلاحيات التنفيذ لـ gradlew
          chmod +x "$ANDROID_DIR/gradlew"
          echo "اكتمل تجهيز مفتاح التوقيع الرقمي release.jks وإعدادات التوقيع بنجاح."

      # ======================= 10. بناء وتوقيع حزمة AAB للإنتاج =======================
      - name: "10. بناء وتوقيع حزمة AAB للإنتاج"
        run: |
          echo "=== بناء وتوقيع حزمة AAB الموجهة لمتجر Google Play ==="
          ANDROID_DIR="${{ env.APP_DIR }}/src-capacitor/android"
          BUILD_GRADLE="$ANDROID_DIR/app/build.gradle"

          DATE_CODE=$(date +%Y%m%d)
          DATE_NAME=$(date +%Y.%m.%d)
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$((DATE_CODE * 100 + (RUN_NUM % 100)))
          VERSION_NAME="${DATE_NAME}.${RUN_NUM}"

          echo "تحديث رقم الإصدار: VersionCode = $VERSION_CODE | VersionName = $VERSION_NAME"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" "$BUILD_GRADLE"
            sed -i -E "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
            sed -i -E "s/versionName '.*'/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ env.APP_KEY }}-v$VERSION_NAME" >> $GITHUB_ENV

          cd "$ANDROID_DIR"
          echo "بدء بناء حزمة الإنتاج عبر ./gradlew bundleRelease..."
          ./gradlew bundleRelease

      # ======================= 11. بناء وتوقيع APK =======================
      - name: "11. بناء وتوقيع APK"
        run: |
          echo "=== بناء وتوقيع حزمة APK للتوزيع المباشر والفحص الميداني ==="
          ANDROID_DIR="${{ env.APP_DIR }}/src-capacitor/android"
          cd "$ANDROID_DIR"
          ./gradlew assembleRelease

          echo "تجهيز وتنسيق ملاحظات الإصدار (WhatsNew) بحد أقصى 500 حرف لـ Google Play..."
          mkdir -p "$GITHUB_WORKSPACE/distribution/whatsnew"
          RAW_NOTES="${{ inputs.release_notes }}"
          if [ -z "$RAW_NOTES" ]; then
            RAW_NOTES="تحديثات دورية، تحسينات في الأداء وإصلاحات استقرار لنظام تخطيط موارد المؤسسات FastFree ERP."
          fi
          # اقتطاع الملاحظات إلى 500 حرف كحد أقصى وفق متطلبات Google Play Console
          TRIMMED_NOTES=$(echo "$RAW_NOTES" | cut -c 1-500)
          echo "$TRIMMED_NOTES" > "$GITHUB_WORKSPACE/distribution/whatsnew/whatsnew-ar-SA"
          echo "$TRIMMED_NOTES" > "$GITHUB_WORKSPACE/distribution/whatsnew/whatsnew-ar"
          echo "$TRIMMED_NOTES" > "$GITHUB_WORKSPACE/distribution/whatsnew/whatsnew-en-US"
          echo "ملاحظات الإصدار المعتمدة (${#TRIMMED_NOTES} حرف):"
          cat "$GITHUB_WORKSPACE/distribution/whatsnew/whatsnew-ar"

      # ======================= 12. رفع الحزم إلى Google Play Console =======================
      - name: "12. رفع الحزم إلى Google Play Console"
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          service_account_json_plaintext: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_ID }}
          releaseFiles: ${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: "completed"
          whatsNewDirectory: "distribution/whatsnew"

      # ======================= 13. إنشاء Release رسمي على GitHub =======================
      - name: "13. إنشاء Release رسمي على GitHub"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.APP_NAME }} — v${{ env.VERSION_NAME }} (بناء رقم ${{ env.VERSION_CODE }})"
          body: |
            ## FastFree Mobile Release — ${{ env.APP_NAME }}
            - **إصدار التطبيق:** `${{ env.VERSION_NAME }}`
            - **رقم البناء (Version Code):** `${{ env.VERSION_CODE }}`
            - **معرّف الحزمة (Package ID):** `${{ env.PACKAGE_ID }}`
            - **مسار النشر على Google Play:** `${{ inputs.track }}`
            - **مستوى Android Target SDK:** `36`
            
            ### ملاحظات الإصدار:
            ${{ inputs.release_notes || 'تحديثات دورية، تحسينات في الأداء وإصلاحات استقرار لنظام تخطيط موارد المؤسسات FastFree ERP.' }}
          files: |
            ${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/bundle/release/*.aab
            ${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: ${{ inputs.track == 'internal' }}
