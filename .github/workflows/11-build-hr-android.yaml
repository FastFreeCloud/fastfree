name: 11-build-hr-android

on:
  workflow_dispatch:

concurrency:
  group: build-hr-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--no-deprecation"
  APP_DIR: fastfree_hr
  APP_NAME: "FastFree HR"
  APP_ID: com.fastfree.hr
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.11.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Safe directory
        run: git config --global safe.directory '*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Install Capacitor dependencies
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npm install

      - name: Prepare Quasar
        working-directory: apps/${{ env.APP_DIR }}
        run: |
          mkdir -p .quasar
          echo '{"compilerOptions":{}}' > .quasar/tsconfig.json
          pnpm exec quasar prepare --silent

      - name: Build web assets
        working-directory: apps/${{ env.APP_DIR }}
        run: pnpm exec quasar build

      - name: Add Android Platform
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npx cap sync android

      - name: Generate Keystore
        run: |
          KEYSTORE_DIR="apps/${{ env.APP_DIR }}/signing"
          KEYSTORE="$KEYSTORE_DIR/release.jks"
          mkdir -p "$KEYSTORE_DIR"
          
          if [ -f "$KEYSTORE" ]; then
            echo "Keystore exists"
          else
            keytool -genkeypair \
              -alias fastfree \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE" \
              -storepass FastFree@2026 \
              -keypass FastFree@2026 \
              -dname "CN=FastFree, OU=IT, O=FastFree, L=Riyadh, ST=Riyadh, C=SA"
            echo "Keystore created"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build unsigned release APK
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          KEYSTORE="apps/${{ env.APP_DIR }}/signing/release.jks"
          UNSIGNED_APK=$(find "apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/release" -name "*.apk" | head -1)
          if [ -n "$UNSIGNED_APK" ]; then
            SIGNED_APK="apps/${{ env.APP_DIR }}/dist-apk/signed-release.apk"
            mkdir -p "apps/${{ env.APP_DIR }}/dist-apk"
            
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | head -1)
            
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks "$KEYSTORE" \
                --ks-pass pass:FastFree@2026 \
                --ks-key-alias fastfree \
                --key-pass pass:FastFree@2026 \
                "$UNSIGNED_APK"
              cp "$UNSIGNED_APK" "$SIGNED_APK"
              echo "APK signed with apksigner: $SIGNED_APK"
            else
              echo "apksigner not found, using jarsigner"
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE" \
                -storepass FastFree@2026 \
                -keypass FastFree@2026 \
                "$UNSIGNED_APK" fastfree
              cp "$UNSIGNED_APK" "$SIGNED_APK"
              echo "APK signed with jarsigner: $SIGNED_APK"
            fi
          else
            echo "No APK found to sign"
            exit 1
          fi

      - name: Build AAB for Google Play
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: gradle bundleRelease

      - name: Collect APK
        run: |
          mkdir -p apps/${{ env.APP_DIR }}/dist-apk
          if [ -f "apps/${{ env.APP_DIR }}/dist-apk/signed-release.apk" ]; then
            echo "Signed APK ready"
          elif [ -f "apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk apps/${{ env.APP_DIR }}/dist-apk/fastfree-hr.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: fastfree-hr-apk
          path: apps/${{ env.APP_DIR }}/dist-apk/signed-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_ID }}-aab
          path: apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Keystore as TXT
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > keystore_base64.txt
          echo "fastfree" > keystore_alias.txt
          echo "FastFree@2026" > keystore_password.txt
          echo "FastFree@2026" > keystore_store_password.txt

      - name: Upload Keystore TXT Files
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_ID }}-keystore-txt
          path: |
            keystore_base64.txt
            keystore_alias.txt
            keystore_password.txt
            keystore_store_password.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Safe directory
        run: git config --global safe.directory '*'

      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: fastfree-hr-apk
          path: release

      - name: Get version
        id: version
        run: |
          VERSION=$(date +%Y.%m.%d)-$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: hr-v${{ steps.version.outputs.version }}
          name: "FastFree HR v${{ steps.version.outputs.version }}"
          files: release/fastfree-hr.apk
          generate_release_notes: true



