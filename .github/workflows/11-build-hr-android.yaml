name: 11-build-hr-android

on:
  workflow_dispatch:

concurrency:
  group: build-hr-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: fastfree_hr
  APP_NAME: "FastFree HR"
  APP_ID: com.fastfree.hr
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.11.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare Quasar
        working-directory: apps/${{ env.APP_DIR }}
        run: |
          mkdir -p .quasar
          echo '{"compilerOptions":{}}' > .quasar/tsconfig.json
          pnpm exec quasar prepare --silent

      - name: Build web assets
        working-directory: apps/${{ env.APP_DIR }}
        run: pnpm exec quasar build

      - name: Install Capacitor dependencies
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npm install

      - name: Sync Capacitor
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npx cap sync android

      - name: Generate Keystore if not exists
        run: |
          echo "Checking keystore..."
          
          # Check if keystore file exists
          if [ -f "apps/${{ env.APP_DIR }}/src-capacitor/android/app/release.jks" ]; then
            echo "Keystore exists"
          else
            echo "Generating keystore..."
            
            # Decode base64 keystore
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/${{ env.APP_DIR }}/src-capacitor/android/app/release.jks
            
            echo "Keystore generated"
          fi

      - name: Build release APK
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.jks \
            -Pandroid.injected.signing.store.password=FastFree@2026 \
            -Pandroid.injected.signing.key.alias=fastfree \
            -Pandroid.injected.signing.key.password=FastFree@2026

      - name: Build AAB for Google Play
        run: |
          cd apps/${{ env.APP_DIR }}/src-capacitor/android
          ./gradlew bundleRelease

      - name: Collect APK
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: |
          mkdir -p ../../dist-apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../../dist-apk/fastfree-hr.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../../dist-apk/fastfree-hr.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fastfree-hr-apk
          path: apps/${{ env.APP_DIR }}/dist-apk/fastfree-hr.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-aab
          path: apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Keystore as TXT
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > keystore_base64.txt
          echo "fastfree" > keystore_alias.txt
          echo "FastFree@2026" > keystore_password.txt
          echo "FastFree@2026" > keystore_store_password.txt

      - name: Upload Keystore TXT Files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-keystore-txt
          path: |
            keystore_base64.txt
            keystore_alias.txt
            keystore_password.txt
            keystore_store_password.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fastfree-hr-apk
          path: release

      - name: Get version
        id: version
        run: |
          VERSION=$(date +%Y.%m.%d)-$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hr-v${{ steps.version.outputs.version }}
          name: "FastFree HR v${{ steps.version.outputs.version }}"
          files: release/fastfree-hr.apk
          generate_release_notes: true



