name: "Deploy client3"

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  update:
    name: "Deploy client3 config via SSH"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Nix"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Deploy via SSH + nixos-rebuild"
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          # Copy flake files to VPS
          sshpass -p "$SSHPASS" scp -o StrictHostKeyChecking=no -r \
            apps/fastfree_os/flake.nix \
            apps/fastfree_os/flake.lock \
            apps/fastfree_os/nix/ \
            root@${{ secrets.CLIENT3_IP }}:/tmp/fastfree_os/

          # Force pull latest images before rebuild
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'PULL'
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_hr:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_erp:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_pos:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_ledger:latest || true
            echo 'All images pulled'
            podman rm -f fastfree-hr-frontend fastfree-erp-frontend fastfree-pos-frontend fastfree-ledger-frontend 2>/dev/null || true
            echo 'Old SPA containers removed'
          PULL

          # Run nixos-rebuild on VPS
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} \
            "cd /tmp/fastfree_os && nixos-rebuild switch --flake .#client3 && systemctl restart caddy"

      - name: "Verify"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} \
          "systemctl list-units --type=service --state=running | grep -E 'fastfree|caddy|mariadb' || true"

      - name: "Diagnostic - Container Logs & Errors"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} << 'DIAG'
          echo "=== PODMAN CONTAINERS ==="
          podman ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== CADDY ERRORS ==="
          journalctl -u caddy --no-pager -n 20 2>&1 || true
          echo ""
          echo "=== CONTAINER LOGS (last 10 lines each) ==="
          for c in $(podman ps --format '{{.Names}}'); do
            echo "--- $c ---"
            podman logs --tail 10 "$c" 2>&1 || true
            echo ""
          done
          echo ""
          echo "=== MARIADB STATUS ==="
          systemctl is-active mysql 2>&1 || true
          echo ""
          echo "=== PORTS LISTENING ==="
          ss -tlnp | grep -E '80|443|8080|8082|9000|9001|9002|9003|9004|3306|6379' 2>&1 || true
          echo ""
          echo "=== DISK SPACE ==="
          df -h / 2>&1 || true
          echo ""
          echo "=== FAILED SYSTEMD UNITS ==="
          systemctl --failed 2>&1 || true
          DIAG
