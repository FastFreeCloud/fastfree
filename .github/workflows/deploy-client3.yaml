name: "Deploy client3"

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  update:
    name: "Deploy client3 config via SSH"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Nix"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Deploy via SSH + nixos-rebuild"
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          # Copy flake files to VPS
          sshpass -p "$SSHPASS" scp -o StrictHostKeyChecking=no -r \
            apps/fastfree_os/flake.nix \
            apps/fastfree_os/flake.lock \
            apps/fastfree_os/nix/ \
            root@${{ secrets.CLIENT3_IP }}:/tmp/fastfree_os/

          # Full cleanup: stop, reset, remove everything, flush stale nftables
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'RESET'
            for svc in hr erp pos ledger; do
              systemctl stop "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
              systemctl reset-failed "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
            done
            systemctl daemon-reload
            podman rm -f fastfree-hr-frontend fastfree-erp-frontend fastfree-pos-frontend fastfree-ledger-frontend 2>/dev/null || true
            # Remove stale podman NAT rules (old port-mapping) — safe, won't kill SSH
            nft delete table ip nat 2>/dev/null || true
            nft delete table ip6 nat 2>/dev/null || true
            podman network rm fastfree-net 2>/dev/null || true
            echo 'All SPA services stopped, containers removed, stale NAT rules cleaned'
          RESET

          # Pull images
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'PULL'
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_hr:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_erp:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_pos:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_ledger:latest || true
            echo 'All images pulled'
          PULL

          # Run nixos-rebuild (allow failure, we'll restart services after)
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} \
            "cd /tmp/fastfree_os && nixos-rebuild switch --flake .#client3 || true"

          # Reset any failed units from rebuild and start services manually
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'START'
            for svc in hr erp pos ledger; do
              systemctl reset-failed "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
            done
            systemctl daemon-reload
            for svc in hr erp pos ledger; do
              systemctl start "podman-fastfree-${svc}-frontend.service" 2>/dev/null || echo "FAILED: ${svc}"
            done
            systemctl restart caddy
            echo 'All services started'
          START

      - name: "Verify"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} \
          "systemctl list-units --type=service --state=running | grep -E 'fastfree|caddy|mariadb' || true"

      - name: "Diagnostic - Deep Network & Firewall"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} << 'DIAG'
          echo "=== ALL NFTABLES RULES ==="
          nft list ruleset 2>&1 | head -80 || echo "nft not available"
          echo ""
          echo "=== IPTABLES NAT ==="
          iptables -t nat -L -n -v 2>&1 | head -30 || echo "iptables not available"
          echo ""
          echo "=== IPTABLES FILTER ==="
          iptables -t filter -L -n -v 2>&1 | head -30 || echo "iptables not available"
          echo ""
          echo "=== CURL WITH TIMEOUT 3s ==="
          curl -m 3 -sI http://127.0.0.1:9002/ 2>&1 || echo "TIMEOUT/FAILED: 9002"
          curl -m 3 -sI http://127.0.0.1:9001/ 2>&1 || echo "TIMEOUT/FAILED: 9001"
          curl -m 3 -sI http://127.0.0.1:9000/ 2>&1 || echo "TIMEOUT/FAILED: 9000"
          curl -m 3 -sI http://127.0.0.1:9003/ 2>&1 || echo "TIMEOUT/FAILED: 9003"
          echo ""
          echo "=== CURL FROM INSIDE CONTAINER ==="
          podman exec fastfree-hr-frontend curl -m 3 -sI http://127.0.0.1:9002/ 2>&1 || echo "TIMEOUT/FAILED: container curl"
          echo ""
          echo "=== CADDY CONTAINER CADDYFILE ==="
          podman exec fastfree-hr-frontend cat /etc/caddy/Caddyfile 2>&1 || true
          echo ""
          echo "=== PODMAN CONTAINERS ==="
          podman ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== PORTS LISTENING ==="
          ss -tlnp | grep -E '80|443|900[0-4]|3306|6379' 2>&1 || true
          echo ""
          echo "=== HOST CADDY ERRORS (last 10) ==="
          journalctl -u caddy --no-pager -n 10 --since "2 min ago" 2>&1 || true
          echo ""
          echo "=== FAILED SYSTEMD UNITS ==="
          systemctl --failed 2>&1 || true
          DIAG
