name: "🔄 Deploy client3"

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  update:
    name: "🔄 Deploy client3 via Colmena"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Install Nix"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "🔧 Install Colmena"
        run: nix profile install nixpkgs#colmena

      - name: "📦 Deploy via Colmena"
        working-directory: apps/fastfree_os
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          # Setup SSH agent with deploy key
          eval "$(ssh-agent -s -a $SSH_AUTH_SOCK)"
          echo "${{ secrets.CLIENT3_DEPLOY_KEY }}" | ssh-add -
          
          # Deploy using Colmena
          colmena apply --on client3

      - name: "✅ Verify"
        run: |
          eval "$(ssh-agent -s -a /tmp/ssh_agent_sock)"
          echo "${{ secrets.CLIENT3_DEPLOY_KEY }}" | ssh-add -
          ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "systemctl list-units --type=service --state=running | grep -E 'fastfree|caddy|mariadb' || true"
