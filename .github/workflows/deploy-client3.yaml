name: "Deploy client3"

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  update:
    name: "Deploy client3 via Colmena"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Nix"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Setup SSH key"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.CLIENT3_DEPLOY_KEY }}" > ~/.ssh/client3_deploy
          chmod 600 ~/.ssh/client3_deploy
          # Pre-add host key
          ssh-keyscan -H ${{ secrets.CLIENT3_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H fastfree.cloud >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: "Deploy via Colmena"
        working-directory: apps/fastfree_os
        run: |
          # NIX_SSHOPTS is read by nix copy (used internally by Colmena for closure push)
          export NIX_SSHOPTS="-i $HOME/.ssh/client3_deploy -o StrictHostKeyChecking=no -o User=root"
          nix run github:zhaofengli/colmena -- apply --on client3

      - name: "Verify"
        run: |
          ssh -i ~/.ssh/client3_deploy -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "systemctl list-units --type=service --state=running | grep -E 'fastfree|caddy|mariadb' || true"
