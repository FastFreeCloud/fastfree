name: "Deploy client3"

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  update:
    name: "Deploy client3 config via SSH"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Nix"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Deploy via SSH + nixos-rebuild"
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          # Copy flake files to VPS
          sshpass -p "$SSHPASS" scp -o StrictHostKeyChecking=no -r \
            apps/fastfree_os/flake.nix \
            apps/fastfree_os/flake.lock \
            apps/fastfree_os/nix/ \
            root@${{ secrets.CLIENT3_IP }}:/tmp/fastfree_os/

          # Cleanup: stop old SPA container services + remove containers
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'RESET'
            for svc in hr erp pos ledger; do
              systemctl stop "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
              systemctl reset-failed "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
              systemctl disable "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
            done
            systemctl daemon-reload
            podman rm -f fastfree-hr-frontend fastfree-erp-frontend fastfree-pos-frontend fastfree-ledger-frontend 2>/dev/null || true
            # Remove stale podman NAT rules
            nft delete table ip nat 2>/dev/null || true
            nft delete table ip6 nat 2>/dev/null || true
            podman network rm fastfree-net 2>/dev/null || true
            echo 'Cleanup done: old SPA containers removed'
          RESET

          # Pull SPA images (needed for podman cp extraction)
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'PULL'
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_hr:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_erp:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_pos:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_ledger:latest || true
            echo 'All images pulled'
          PULL

          # Run nixos-rebuild (extracts SPA files + configures host Caddy)
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} \
            "cd /tmp/fastfree_os && nixos-rebuild switch --flake .#client3 || true"

          # Reset any failed units from rebuild, ensure caddy is running
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'START'
            systemctl daemon-reload
            systemctl reset-failed fastfree-hr-spa.service 2>/dev/null || true
            systemctl reset-failed fastfree-erp-spa.service 2>/dev/null || true
            systemctl reset-failed fastfree-pos-spa.service 2>/dev/null || true
            systemctl reset-failed fastfree-ledger-spa.service 2>/dev/null || true
            # Re-run SPA extraction if needed
            systemctl start fastfree-hr-spa.service 2>/dev/null || true
            systemctl start fastfree-erp-spa.service 2>/dev/null || true
            systemctl start fastfree-pos-spa.service 2>/dev/null || true
            systemctl start fastfree-ledger-spa.service 2>/dev/null || true
            systemctl restart caddy
            echo 'All services started'
          START

      - name: "Verify"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} \
          "systemctl list-units --type=service --state=running | grep -E 'fastfree|caddy|mariadb' || true"

      - name: "Diagnostic"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} << 'DIAG'
          echo "=== SPA FILES ON HOST ==="
          for app in hr erp ledger pos; do
            dir="/srv/fastfree-${app}"
            if [ -d "$dir" ]; then
              echo "$dir: $(ls "$dir" 2>/dev/null | head -5)..."
            else
              echo "$dir: MISSING"
            fi
          done
          echo ""
          echo "=== CURL TESTS (host Caddy) ==="
          curl -m 5 -sI https://hr.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: hr"
          curl -m 5 -sI https://erp.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: erp"
          curl -m 5 -sI https://ledger.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: ledger"
          curl -m 5 -sI https://pos.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: pos"
          echo ""
          echo "=== CADDY CONFIG ==="
          cat /etc/caddy/Caddyfile 2>/dev/null || journalctl -u caddy --no-pager -n 5 2>&1
          echo ""
          echo "=== FILE PERMISSIONS ==="
          ls -la /srv/fastfree-hr/ 2>&1 | head -5
          echo ""
          echo "=== PODMAN CONTAINERS ==="
          podman ps -a --format "table {{.Names}}\t{{.Status}}"
          echo ""
          echo "=== HOST CADDY ERRORS (last 10) ==="
          journalctl -u caddy --no-pager -n 10 --since "2 min ago" 2>&1 || true
          echo ""
          echo "=== FAILED SYSTEMD UNITS ==="
          systemctl --failed 2>&1 || true
          DIAG
