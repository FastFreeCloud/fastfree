name: "🐳 بناء Docker Image + Release تلقائي"

# ═══════════════════════════════════════════════════════════
#   بناء صورة Docker + إنشاء Tag + Release تلقائي
#   ─────────────────────────────────────────
#   • يشتغل تلقائي مع كل push على main
#   • ينشئ Tag جديد (v1.0.x) تلقائي
#   • يبني Docker Image ويرفعها على GHCR
#   • ينشئ GitHub Release
# ═══════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      frappe_version:
        description: "Frappe version branch"
        required: false
        type: string
        default: "version-15"
  workflow_call:
    inputs:
      frappe_version:
        description: "Frappe version branch"
        required: false
        type: string
        default: "version-15"

# ── منع التشغيل المتزامن على نفس الـ Branch ──
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

# ─── المتغيرات: غيّرها حسب مشروعك ───
env:
  FRAPPE_VERSION: ${{ inputs.frappe_version || 'version-15' }}
  INCLUDE_ERPNEXT: "true"
  ERPNEXT_VERSION: version-15
  REGISTRY: ghcr.io

permissions: {}

jobs:
  build:
    name: "🐳 بناء ورفع الصورة"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 1: التحضير                    ║
      # ╚═══════════════════════════════════════╝

      - name: "1️⃣ تحميل كود التطبيق"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 1.5: فحص الأخطاء والتحذيرات  ║
      # ╚═══════════════════════════════════════╝

      - name: "1️⃣5️⃣ فحص GitHub Actions workflow"
        continue-on-error: true
        uses: reviewdog/action-Actionlint@v1
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          level: info
          reporter: github-pr-check

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 2: توليد Tag تلقائي           ║
      # ╚═══════════════════════════════════════╝

      - name: "2️⃣ توليد Tag تلقائي"
        id: auto_tag
        run: |
          echo "🔍 جاري البحث عن آخر Tag..."

          # ── جلب جميع الـ Tags من GitHub ──
          LATEST=$(git ls-remote --tags origin | \
            grep -o 'refs/tags/v[0-9]*\.[0-9]*\.[0-9]*$' | \
            sed 's|refs/tags/||' | \
            sort -V | tail -1)

          echo "📌 آخر Tag موجود: ${LATEST:-لا يوجد}"

          # ── إذا ما فيه Tags → نبدأ من v1.0.0 ──
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.0.0"
          else
            # ── ترقية الرقم الأخير (patch) ──
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo ""
          echo "✅ Tag الجديد: $NEW_TAG"
          echo "TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$NEW_TAG" >> "$GITHUB_ENV"

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 3: إنشاء Tag على GitHub       ║
      # ╚═══════════════════════════════════════╝

      - name: "3️⃣ إنشاء Tag على GitHub"
        run: |
          TAG="${{ steps.auto_tag.outputs.TAG }}"
          echo "📌 فحص Tag: $TAG"

          # فحص إذا كان Tag موجود مسبقاً
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG موجود مسبقاً —تخطي الإنشاء"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ تم إنشاء Tag: $TAG"
          fi

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 4: كشف اسم التطبيق            ║
      # ╚═══════════════════════════════════════╝

      - name: "4️⃣ استخراج اسم التطبيق من المستودع"
        id: detect_app
        run: |
          APP_NAME="${{ github.event.repository.name }}"
          IMAGE_NAME="$(echo "${{ github.repository_owner }}/fastfree_backend" | tr '[:upper:]' '[:lower:]')"

          echo "✅ اسم المستودع (التطبيق): $APP_NAME"
          echo "✅ اسم الصورة: $IMAGE_NAME"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 5: تحميل frappe_docker        ║
      # ╚═══════════════════════════════════════╝

      - name: "5️⃣ تحميل frappe_docker"
        timeout-minutes: 3
        run: |
          echo "🔧 نسخة Frappe: ${{ env.FRAPPE_VERSION }}"

          git clone --depth 1 \
            https://github.com/frappe/frappe_docker.git \
            /tmp/frappe_docker

          echo "✅ تم تحميل frappe_docker"

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 6: إعداد Docker               ║
      # ╚═══════════════════════════════════════╝

      - name: "6️⃣ إعداد Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "6️⃣5️⃣ تثبيت skopeo"
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: "7️⃣ تسجيل الدخول في GHCR"
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "7️⃣5️⃣ التأكد من وجود Package على GHCR"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ── فحص وجود الـ Package ──
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/fastfree_backend")
          
          if [ "$HTTP_CODE" = "404" ]; then
            echo "📦 الـ Package غير موجود — جاري الإنشاء..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${{ github.repository_owner }}/packages/container/fastfree_backend" \
              -d '{"visibility": "public"}' || echo "⚠️ فشل الإنشاء — قد يكون موجود مسبقاً"
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "✅ الـ Package موجود فعلاً"
          else
            echo "⚠️ استجابة غير متوقعة: $HTTP_CODE"
          fi

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 7: تحديد Tags للصورة           ║
      # ╚═══════════════════════════════════════╝

      - name: "8️⃣ توليد Tags و Metadata"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.auto_tag.outputs.TAG }}
            type=sha,prefix=,format=short

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 8: تجهيز apps.json            ║
      # ╚═══════════════════════════════════════╝

      - name: "9️⃣ توليد apps.json (jq)"
        run: |
          # ── بناء apps.json بـ jq ──
          # ملاحظة: fastfree repo مش Frappe app — مش مضاف هنا
          # الـ Frappe app هيتثبت لاحقاً عند التشغيل
          jq -n \
            --arg include_erpnext "${{ env.INCLUDE_ERPNEXT }}" \
            --arg erpnext_ver "${{ env.ERPNEXT_VERSION }}" \
            '
            [
              (if $include_erpnext == "true" then {url: "https://github.com/frappe/erpnext", branch: $erpnext_ver} else empty end)
            ]
            ' > /tmp/apps.json

          echo "✅ apps.json:"
          jq '.' /tmp/apps.json

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 8.5: فحص apps.json            ║
      # ╚═══════════════════════════════════════╝

      - name: "🔟 فحص apps.json (jq)"
        run: |
          echo "🔍 فحص apps.json..."
          if jq empty /tmp/apps.json; then
            echo "✅ apps.json صالح"
          else
            echo "❌ apps.json غير صالح!"
            exit 1
          fi

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 9: بناء الصورة                ║
      # ╚═══════════════════════════════════════╝

      - name: "1️⃣1️⃣ بناء Docker Image (Layered)"
        timeout-minutes: 45
        run: |
          cd /tmp/frappe_docker

          # ── اكتشاف نوع Containerfile ──
          if grep -q "mount=type=secret" images/layered/Containerfile 2>/dev/null; then
            CONTAINERFILE="images/layered/Containerfile"
            BUILD_METHOD="secret"
            echo "🔒 Containerfile: Layered (--secret)"
          elif [ -f images/custom/Containerfile ]; then
            CONTAINERFILE="images/custom/Containerfile"
            BUILD_METHOD="build-arg"
            echo "📦 Containerfile: Custom (--build-arg)"
          else
            echo "::error::لا يوجد Containerfile مناسب!"
            ls -la images/*/
            exit 1
          fi

          echo "📋 Frappe: ${{ env.FRAPPE_VERSION }}"
          echo "🏷️ Tag: ${{ steps.auto_tag.outputs.TAG }}"
          echo ""

          # ── بناء الصورة ──
          if [ "$BUILD_METHOD" = "secret" ]; then
            DOCKER_BUILDKIT=1 docker build \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
              --build-arg=FRAPPE_BRANCH=${{ env.FRAPPE_VERSION }} \
              --secret=id=apps_json,src=/tmp/apps.json \
              --tag build-temp:latest \
              --file="$CONTAINERFILE" .
          else
            APPS_JSON_BASE64=$(base64 -w 0 /tmp/apps.json)
            export APPS_JSON_BASE64
            DOCKER_BUILDKIT=1 docker build \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
              --build-arg=FRAPPE_BRANCH=${{ env.FRAPPE_VERSION }} \
              --build-arg=PYTHON_VERSION=3.11 \
              --build-arg=NODE_VERSION=22 \
              --secret=id=apps_json,src=/tmp/apps.json \
              --tag build-temp:latest \
              --file="$CONTAINERFILE" .
          fi

          echo ""
          echo "✅ تم بناء الصورة بنجاح"

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 10: التحقق من الصورة          ║
      # ╚═══════════════════════════════════════╝

      - name: "1️⃣2️⃣ التحقق من صحة الصورة"
        run: |
          echo "🔍 فحص الصورة المبنية..."
          echo ""

          # ── حجم الصورة ──
          declare SIZE
          SIZE=$(docker image inspect build-temp:latest --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "📦 حجم الصورة: ${SIZE_MB} MB"

          if [ "$SIZE_MB" -lt 100 ]; then
            echo "::error::حجم الصورة صغير جداً (${SIZE_MB} MB) — غالباً البناء فشل"
            exit 1
          fi

          # ── عدد الطبقات ──
          declare LAYERS
          LAYERS=$(docker history build-temp:latest --quiet | wc -l)
          echo "📚 عدد الطبقات: $LAYERS"

          echo ""
          echo "✅ فحص الصورة اكتمل"

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 11: تسمية ورفع الصورة         ║
      # ╚═══════════════════════════════════════╝

      - name: "1️⃣3️⃣ تسمية الصورة (Tags)"
        run: |
          echo "🏷️ Tags:"
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            if [ -n "$tag" ]; then
              docker tag build-temp:latest "$tag"
              echo "  ✅ $tag"
            fi
          done

      - name: "1️⃣4️⃣ حفظ الصورة كـ tarball"
        run: |
          docker save build-temp:latest -o /tmp/backend-image.tar
          echo "✅ تم حفظ الصورة كـ tarball"

      - name: "1️⃣4️⃣5️⃣ رفع الصورة على GHCR (skopeo)"
        env:
          SKOPEO_DEST_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📤 جاري الرفع بـ skopeo..."
          echo ""
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            if [ -n "$tag" ]; then
              skopeo copy \
                --dest-creds "$SKOPEO_DEST_CREDS" \
                docker-archive:/tmp/backend-image.tar \
                "docker://${tag}"
              echo "  ✅ تم رفع: $tag"
            fi
          done

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 12: إنشاء GitHub Release      ║
      # ╚═══════════════════════════════════════╝

      - name: "1️⃣5️⃣ إنشاء GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.auto_tag.outputs.TAG }}
          name: ${{ steps.auto_tag.outputs.TAG }}
          body: |
            ## 🐳 بناء Docker Image

            **${{ env.APP_NAME }}** — Frappe ${{ env.FRAPPE_VERSION }}

            ### تفاصيل الصورة
            | الخاصية | القيمة |
            |---------|--------|
            | **السجل** | `${{ env.REGISTRY }}` |
            | **الصورة** | `${{ env.IMAGE_NAME }}` |
            | **Frappe** | `${{ env.FRAPPE_VERSION }}` |
            | **ERPNext** | `${{ env.INCLUDE_ERPNEXT }}` |
            | **Tag** | `${{ steps.auto_tag.outputs.TAG }}` |
            | **Commit** | `${{ github.sha }}` |

            ### 🏷️ Docker Tags
            ```
            ${{ steps.meta.outputs.tags }}
            ```

            ### 📥 أمر السحب
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.auto_tag.outputs.TAG }}
            ```

            ---
            *تم البناء و الرفع بواسطة GitHub Actions*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 13: التنظيف                   ║
      # ╚═══════════════════════════════════════╝

      - name: "1️⃣6️⃣ تنظيف Docker"
        if: always()
        run: |
          docker image rm build-temp:latest 2>/dev/null || true
          docker buildx prune --filter "until=1h" --force 2>/dev/null || true
          rm -f /tmp/apps.json
          echo "🧹 تم التنظيف"

      # ╔═══════════════════════════════════════╗
      # ║  المرحلة 14: ملخص النتائج              ║
      # ╚═══════════════════════════════════════╝

      - name: "📋 ملخص النتائج"
        if: always()
        run: |
          {
            echo "## 🐳 نتائج البناء والإصدار"
            echo ""
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| **Tag** | \`${{ steps.auto_tag.outputs.TAG }}\` |"
            echo "| **السجل** | \`${{ env.REGISTRY }}\` |"
            echo "| **الصورة** | \`${{ env.IMAGE_NAME }}\` |"
            echo "| **Frappe** | \`${{ env.FRAPPE_VERSION }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo ""
            echo "### ✅ ما تم إنجازه"
            echo "- ✅ تم إنشاء Tag: \`${{ steps.auto_tag.outputs.TAG }}\`"
            echo "- ✅ تم بناء Docker Image و رفعها على GHCR"
            echo "- ✅ تم إنشاء GitHub Release"
            echo ""
            echo "### 📥 أمر السحب"
            echo "\`\`\`bash"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.auto_tag.outputs.TAG }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
