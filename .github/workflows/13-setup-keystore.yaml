name: Setup Android Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore password'
        required: false
        default: 'FastFree@2026'
      key_alias:
        description: 'Key alias'
        required: false
        default: 'fastfree'
      key_password:
        description: 'Key password'
        required: false
        default: 'FastFree@2026'

jobs:
  setup:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          echo "🔐 Generating Android keystore..."
          
          # Generate keystore
          keytool -genkeypair \
            -v \
            -keystore fastfree-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias ${{ github.event.inputs.key_alias || 'fastfree' }} \
            -storepass ${{ github.event.inputs.keystore_password || 'FastFree@2026' }} \
            -keypass ${{ github.event.inputs.key_password || 'FastFree@2026' }} \
            -dname "CN=FastFree, OU=Development, O=FastFree, L=Riyadh, ST=Riyadh, C=SA"
          
          echo "✅ Keystore generated!"
          
          # Encode to base64
          KEYSTORE_BASE64=$(base64 -w 0 fastfree-release.jks)
          
          echo ""
          echo "=========================================="
          echo "  📋 Copy these values to GitHub Secrets"
          echo "=========================================="
          echo ""
          echo "ANDROID_KEYSTORE_BASE64:"
          echo "$KEYSTORE_BASE64"
          echo ""
          echo "ANDROID_KEYSTORE_PASSWORD:"
          echo "${{ github.event.inputs.keystore_password || 'FastFree@2026' }}"
          echo ""
          echo "ANDROID_KEY_ALIAS:"
          echo "${{ github.event.inputs.key_alias || 'fastfree' }}"
          echo ""
          echo "ANDROID_KEY_PASSWORD:"
          echo "${{ github.event.inputs.key_password || 'FastFree@2026' }}"
          echo ""
          echo "=========================================="
          echo ""
          echo "⚠️  Save these values! You'll need them for signing APKs."
          echo ""
          
          # Save to file for download
          echo "$KEYSTORE_BASE64" > fastfree-keystore-base64.txt
          echo "${{ github.event.inputs.keystore_password || 'FastFree@2026' }}" > fastfree-keystore-password.txt
          echo "${{ github.event.inputs.key_alias || 'fastfree' }}" > fastfree-key-alias.txt
          echo "${{ github.event.inputs.key_password || 'FastFree@2026' }}" > fastfree-key-password.txt

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: fastfree-keystore
          path: |
            fastfree-release.jks
            fastfree-keystore-base64.txt
            fastfree-keystore-password.txt
            fastfree-key-alias.txt
            fastfree-key-password.txt
          retention-days: 30

