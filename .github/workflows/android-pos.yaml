name: "Android: FastFree POS"

on:
  push:
    tags:
      - 'pos-v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track'
        required: false
        type: choice
        default: 'internal'
        options:
          - 'internal'
          - 'production'

concurrency:
  group: android-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    uses: ./.github/workflows/android-pipeline.yaml
    with:
      app_name: 'FastFree POS'
      app_key: 'pos'
      app_dir: 'apps/fastfree_pos'
      package_id: 'com.fastfree.pos'
      track: ${{ inputs.track }}
    secrets: inherit
