name: "🚀 Deploy to Hostinger VPS"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only (no deploy)"
        required: false
        default: false
        type: boolean

env:
  VPS_IP: "76.13.51.10"
  VPS_USER: "root"
  VPS_PASS: "fastfree@2026"
  DEPLOY_CLIENT: "client3"

jobs:
  deploy:
    name: "🚀 Deploy to Hostinger VPS"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Setup SSH"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass openssh-client
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: "🔍 Check Current Deployment"
        run: |
          echo "========================================="
          echo "🔍 Checking current deployment on VPS..."
          echo "========================================="
          sshpass -p '${{ env.VPS_PASS }}' ssh -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_IP }} \
            "echo '📋 NixOS Version:' && nixos-version && echo '' && echo '📋 Hostname:' && hostname && echo '' && echo '📋 Flake Config:' && cat /etc/fastfree/flake-config 2>/dev/null || echo 'Not found'"

      - name: "📦 Deploy NixOS Configuration"
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "========================================="
          echo "📦 Deploying to VPS..."
          echo "========================================="
          
          # Create remote directory
          sshpass -p '${{ env.VPS_PASS }}' ssh -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_IP }} \
            "mkdir -p /etc/fastfree"
          
          # Copy configuration files
          sshpass -p '${{ env.VPS_PASS }}' scp -o StrictHostKeyChecking=no -r \
            apps/fastfree_os/flake.nix \
            apps/fastfree_os/flake.lock \
            apps/fastfree_os/nix \
            ${{ env.VPS_USER }}@${{ env.VPS_IP }}:/etc/fastfree/
          
          echo "✅ Configuration copied"

      - name: "🔄 Run nixos-rebuild switch"
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "========================================="
          echo "🔄 Running nixos-rebuild switch..."
          echo "========================================="
          sshpass -p '${{ env.VPS_PASS }}' ssh -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_IP }} \
            "cd /etc/fastfree && nixos-rebuild switch --flake .#${{ env.DEPLOY_CLIENT }} --accept-flake-config"
          
          echo "✅ Deploy completed!"

      - name: "✅ Verify Deployment"
        run: |
          echo "========================================="
          echo "✅ Verification"
          echo "========================================="
          sshpass -p '${{ env.VPS_PASS }}' ssh -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_IP }} \
            "echo '📋 NixOS Version:' && nixos-version && echo '' && echo '📋 Hostname:' && hostname && echo '' && echo '📋 Active Services:' && systemctl list-units --type=service --state=running | grep -E 'fastfree|caddy|mariadb' || echo 'No matching services'"

  rollback:
    name: "↩️ Rollback"
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: "🔧 Setup SSH"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass openssh-client
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: "↩️ Rollback"
        run: |
          echo "========================================="
          echo "↩️ Rolling back..."
          echo "========================================="
          sshpass -p '${{ env.VPS_PASS }}' ssh -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_IP }} \
            "nixos-rebuild switch --rollback --accept-flake-config"
          
          echo "✅ Rollback completed"
