name: 05-website

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/fastfree_website/**'
      - '.github/workflows/05-website.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/fastfree_website/**'
      - '.github/workflows/05-website.yaml'
  workflow_dispatch:

concurrency:
  group: build-website-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  validate-and-build:
    name: "1. Validate and Build Website"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        uses: actions/checkout@v6

      - name: "3. Install Flox"
        uses: flox/install-flox-action@v2

      - name: "4. Install dependencies"
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd apps/fastfree_website && npm install --legacy-peer-deps --ignore-scripts

      - name: "5. TypeScript check"
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd apps/fastfree_website && npx tsc --noEmit

      - name: "6. Lint check"
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd apps/fastfree_website && npm run lint

      - name: "7. Build Next.js app"
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd apps/fastfree_website && npm run build

      - name: "8. Package Website Tarball"
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd apps/fastfree_website && tar -czf ../../fastfree-website.tar.gz .next public package.json

      - name: "9. Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: fastfree-website-tarball
          path: fastfree-website.tar.gz
          retention-days: 1

  release:
    name: "2. Release"
    needs: [validate-and-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "3. Download Website Tarball"
        uses: actions/download-artifact@v4
        with:
          name: fastfree-website-tarball

      - name: "4. Compute next version"
        id: version
        run: |
          LATEST_TAG=$(git tag -l "website-v1.0.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT=1
          else
            CURR=${LATEST_TAG#website-v1.0.}
            NEXT=$((CURR + 1))
          fi
          echo "tag=website-v1.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "Version: website-v1.0.$NEXT"

      - name: "5. Create tag and push"
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed"

      - name: "6. Create GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: fastfree-website.tar.gz
          generate_release_notes: true
