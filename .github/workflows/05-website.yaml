name: 05-website

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/fastfree_website/**'
      - '.github/workflows/05-website.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/fastfree_website/**'
      - '.github/workflows/05-website.yaml'
  workflow_dispatch:

concurrency:
  group: build-website-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  validate-and-build:
    name: "1. Validate and Build Website"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        uses: actions/checkout@v4

      - name: "3. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/fastfree_website/package-lock.json'

      - name: "4. Install dependencies"
        run: |
          cd apps/fastfree_website
          npm install --legacy-peer-deps --ignore-scripts

      - name: "5. TypeScript check"
        run: |
          cd apps/fastfree_website
          npx tsc --noEmit

      - name: "6. Lint check"
        run: |
          cd apps/fastfree_website
          npm run lint

      - name: "7. Build Next.js app"
        run: |
          cd apps/fastfree_website
          npm run build

      - name: "8. Package Website Tarball"
        run: |
          cd apps/fastfree_website
          tar -czf ../../fastfree-website.tar.gz .next public package.json

      - name: "9. Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: fastfree-website-tarball
          path: fastfree-website.tar.gz
          retention-days: 1

  release:
    name: "2. Release"
    needs: [validate-and-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "3. Download Website Tarball"
        uses: actions/download-artifact@v4
        with:
          name: fastfree-website-tarball

      - name: "4. Compute next version"
        id: version
        run: |
          LATEST_TAG=$(git tag -l "website-v*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="website-v1.0.0"
          else
            VERSION="${LATEST_TAG#website-v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            NEXT_TAG="website-v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi
          echo "tag=${NEXT_TAG}" >> $GITHUB_OUTPUT
          echo "Next release tag: ${NEXT_TAG}"

      - name: "5. Create GitHub Release with Tarball"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FastFree Website ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          files: fastfree-website.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
