###############################################################################
# بناء صورة Hyper-V — FastFree OS for Hyper-V (client2)
###############################################################################

name: "🖥️ Build client2 (Hyper-V)"

on:
  workflow_dispatch:

concurrency:
  group: build-client2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hyperv:
    name: 🖥️ بناء صورة Hyper-V
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af --filter "until=24h"
          echo "Disk space after cleanup: $(df -h / | tail -1 | awk '{print $4}')"
        shell: bash

      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build Hyper-V VHDX image
        working-directory: apps/fastfree_os
        run: |
          echo "Building Hyper-V VHDX for client2..."
          nix build .#packages.x86_64-linux.client2 \
            --print-build-logs --no-update-lock-file
          echo "Hyper-V VHDX built"
          ls -lh result/

      - name: Upload Hyper-V artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastfree_client2.vhdx.7z
          path: apps/fastfree_os/result/fastfree_client2.vhdx.7z
          retention-days: 30
