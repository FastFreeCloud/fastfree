#
#       FastFree Web Pipeline — FastFree Clan Panel (لوحة التحكم والبكند)
# ─────────────────────────────────────────────────────────────────────────────
#  • التطبيق:             لوحة تحكم وإدارة سيرفرات Clan (FastFree Clan Panel)
#  • مجلد المصدر:         apps/fastfree_panel (واجهة Quasar SPA وبكند Hono Node.js)
#  • تقنية الواجهة:       Quasar Framework (Vue 3 + Vite SPA)
#  • تقنية البكند:        Node.js / Hono (apps/fastfree_panel/backend)
#  • المنفذ المحلي:        http://127.0.0.1:9099 (الـ Backend API)
#  • النطاق والـ Caddy:    https://panel.<domain> (عكس الوكيل للـ SPA ومسار /api/*)
#  • مسار النشر (NixOS):  /srv/fastfree-panel (الواجهة) و /var/lib/fastfree-panel/backend (البكند)
#  • ملف الـ Tarball:     fastfree-panel.tar.gz
#  • رابط التحميل:        https://github.com/${{ github.repository }}/releases/latest/download/fastfree-panel.tar.gz
#  • نمط الـ Tag الدلالي: panel-v* (مثال: panel-v1.0.0)
#
#  آلية العمل:
#    1. التشغيل يدوي فقط (Manual Trigger عبر workflow_dispatch) لضمان التحكم الكامل.
#    2. فحص الأنواع الصارم للواجهة (vue-tsc) والبكند (tsc) والتحقق من جودة الكود (ESLint).
#    3. بناء الواجهة الثابتة وبناء حزمة البكند المترجمة.
#    4. حزم الواجهة والبكند معاً داخل أرشيف Tarball موحد ورفعه كـ Release رسمي.
###############################################################################

name: "5_fastfree_web_panel"

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "إنشاء Release رسمي على GitHub مع حزمة Tarball؟"
        type: boolean
        default: true

concurrency:
  group: fastfree-web-panel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: "بناء ونشر FastFree Clan Panel"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: "1. إعداد بيئة Git الآمنة"
        run: git config --global safe.directory '*'

      - name: "2. استدعاء الكود المصدري"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "3. إعداد بيئة Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "4. إعداد وتفعيل pnpm 10"
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: "5. تفعيل الكاش السحابي للـ dependencies"
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: "6. تثبيت الحزم والمكتبات"
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          if [ -d "apps/fastfree_panel/backend" ]; then
            cd "apps/fastfree_panel/backend" && npm install
          fi

      - name: "7. تجهيز Quasar"
        run: |
          cd apps/fastfree_panel
          pnpm exec quasar prepare

      - name: "8. فحص الأنواع TypeScript (vue-tsc)"
        run: |
          cd apps/fastfree_panel
          pnpm exec vue-tsc --noEmit
          if [ -d "backend" ]; then
            cd backend && pnpm exec tsc -p tsconfig.json --noEmit
          fi

      - name: "9. فحص الجودة والتنسيق ESLint"
        run: |
          cd apps/fastfree_panel
          pnpm exec eslint -c ./eslint.config.js "./src*/**/*.{ts,js,cjs,mjs,vue}"

      - name: "10. بناء كود الإنتاج المستقل Quasar SPA"
        run: |
          cd apps/fastfree_panel
          pnpm exec quasar build
          if [ -d "backend" ]; then
            cd backend && pnpm exec tsc -p tsconfig.json
          fi

      - name: "11. حزم ملف الـ Tarball للإنتاج"
        run: |
          mkdir -p /tmp/panel-bundle/spa /tmp/panel-bundle/backend/dist
          cp -r apps/fastfree_panel/dist/spa/* /tmp/panel-bundle/spa/
          cp -r apps/fastfree_panel/backend/dist/* /tmp/panel-bundle/backend/dist/
          cp apps/fastfree_panel/backend/package.json /tmp/panel-bundle/backend/
          cd /tmp/panel-bundle
          tar -czf "$GITHUB_WORKSPACE/fastfree-panel.tar.gz" .

      - name: "12. رفع الحزمة كـ Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: fastfree-panel-tarball
          path: fastfree-panel.tar.gz
          retention-days: 7

      - name: "13. حساب رقم الإصدار الدلالي القادم"
        id: version
        if: ${{ inputs.create_release }}
        shell: bash
        run: |
          APP_KEY="panel"
          if [[ "$GITHUB_REF" == refs/tags/${APP_KEY}-v* ]]; then
            NEXT_TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_TAGS=$(git tag -l "${APP_KEY}-v*" || true)
            if [ -z "$RAW_TAGS" ]; then
              LATEST_TAG=""
            else
              LATEST_TAG=$(echo "$RAW_TAGS" | grep -E "^${APP_KEY}-v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1 || true)
            fi

            if [ -z "$LATEST_TAG" ]; then
              NEXT_TAG="${APP_KEY}-v1.0.0"
            else
              VERSION="${LATEST_TAG#${APP_KEY}-v}"
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)
              NEXT_PATCH=$((PATCH + 1))
              NEXT_TAG="${APP_KEY}-v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi
          echo "tag=${NEXT_TAG}" >> $GITHUB_OUTPUT
          echo "Next release tag: ${NEXT_TAG}"

      - name: "14. نشر Release رسمي على GitHub مع ملف الـ Tarball"
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FastFree Clan Panel ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          files: fastfree-panel.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
