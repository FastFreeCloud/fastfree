name: 16-deploy-client3

on:
  workflow_dispatch:

concurrency:
  group: deploy-client3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: "Deploy client3 via SSH"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy config to VPS
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSHPASS" scp -o StrictHostKeyChecking=no -r \
            apps/fastfree_os/flake.nix \
            apps/fastfree_os/flake.lock \
            apps/fastfree_os/nix/ \
            root@${{ secrets.CLIENT3_IP }}:/tmp/fastfree_os/

      - name: Cleanup old SPA containers
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'RESET'
            for svc in hr erp pos ledger; do
              systemctl stop "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
              systemctl reset-failed "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
              systemctl disable "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
            done
            systemctl daemon-reload
            podman rm -f fastfree-hr-frontend fastfree-erp-frontend fastfree-pos-frontend fastfree-ledger-frontend 2>/dev/null || true
            echo 'Cleanup done'
          RESET

      - name: Pull SPA images
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'PULL'
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_hr:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_erp:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_pos:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_ledger:latest || true
            echo 'All images pulled'
          PULL

      - name: Extract SPA files to host
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'EXTRACT'
            for app in hr erp ledger pos; do
              IMAGE="ghcr.io/fastfreecloud/fastfree_${app}:latest"
              DEST="/srv/fastfree-${app}"
              rm -rf "$DEST"
              mkdir -p "$DEST"
              CID=$(podman create "$IMAGE" 2>/dev/null || true)
              if [ -n "$CID" ]; then
                TMPDIR=$(mktemp -d)
                podman export "$CID" | tar -xf - -C "$TMPDIR"
                SRV_SRC=$(find "$TMPDIR" -maxdepth 5 -type d -name srv -path "*/nix/store/*" | head -1)
                if [ -n "$SRV_SRC" ]; then
                  cp -a "$SRV_SRC"/* "$DEST/"
                  echo "EXTRACTED ${app}: $(ls "$DEST")"
                else
                  echo "FAILED: srv/ directory not found in $IMAGE"
                  find "$TMPDIR" -maxdepth 3 -type d | head -20
                fi
                rm -rf "$TMPDIR"
                podman rm "$CID" >/dev/null 2>&1 || true
              else
                echo "FAILED: Could not create container from $IMAGE"
              fi
            done
          EXTRACT

      - name: Fix MySQL for Frappe
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'MYSQLFIX'
            SITE_DIR=$(find /var/lib/containers/storage/volumes/fastfree-backend-sites/_data -name "site_config.json" -path "*/backend.fastfree.cloud/*" 2>/dev/null | head -1)
            DB_PASS=$(grep -o '"db_password"[[:space:]]*:[[:space:]]*"[^"]*"' "$SITE_DIR" | head -1 | grep -o '"[^"]*"$' | tr -d '"')
            DB_NAME=$(grep -o '"db_name"[[:space:]]*:[[:space:]]*"[^"]*"' "$SITE_DIR" | head -1 | grep -o '"[^"]*"$' | tr -d '"')
            echo "site_config: db_password=$DB_PASS db_name=$DB_NAME"

            # Create/fix all _4d users
            EXISTING=$(mysql -u root -p"Fastfree@2026" -N -e "SELECT user FROM mysql.user WHERE user LIKE '_4d%';" 2>/dev/null)
            if [ -n "$EXISTING" ]; then
              for U in $EXISTING; do
                echo "Fixing existing user: $U"
                mysql -u root -p"Fastfree@2026" -e "
                  ALTER USER '$U'@'%' IDENTIFIED VIA mysql_native_password USING PASSWORD('$DB_PASS');
                  ALTER USER '$U'@'localhost' IDENTIFIED VIA mysql_native_password USING PASSWORD('$DB_PASS');
                  GRANT ALL PRIVILEGES ON \`$DB_NAME\`.* TO '$U'@'%';
                  FLUSH PRIVILEGES;" 2>&1
              done
            else
              # No _4d users exist — find what user the backend container expects
              # The backend container logs show: _4d26834d5dde140d
              # Extract from the most recent error log
              EXPECTED_USER=$(journalctl -u podman-fastfree-backend-app.service --no-pager -n 50 2>/dev/null | grep -oP "user '\K[^']*" | grep "^_4d" | head -1)
              if [ -z "$EXPECTED_USER" ]; then
                EXPECTED_USER="_4d26834d5dde140d"
              fi
              echo "Creating missing user: $EXPECTED_USER"
              mysql -u root -p"Fastfree@2026" -e "
                CREATE USER '$EXPECTED_USER'@'%' IDENTIFIED VIA mysql_native_password USING PASSWORD('$DB_PASS');
                CREATE USER '$EXPECTED_USER'@'localhost' IDENTIFIED VIA mysql_native_password USING PASSWORD('$DB_PASS');
                GRANT ALL PRIVILEGES ON \`$DB_NAME\`.* TO '$EXPECTED_USER'@'%';
                GRANT ALL PRIVILEGES ON \`$DB_NAME\`.* TO '$EXPECTED_USER'@'localhost';
                FLUSH PRIVILEGES;" 2>&1 && echo "User created: $EXPECTED_USER" || echo "Failed to create user"
            fi

            # Restart backend to pick up the fix
            systemctl restart podman-fastfree-backend-app.service 2>/dev/null || true
            echo "MySQL fix complete"
          MYSQLFIX

      - name: Run nixos-rebuild
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} \
            "cd /tmp/fastfree_os && nixos-rebuild switch --flake .#client3 || true"

      - name: Restart services
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'START'
            systemctl daemon-reload
            systemctl reset-failed fastfree-backend-websocket.service 2>/dev/null || true
            systemctl reset-failed fastfree-backend-setup.service 2>/dev/null || true
            systemctl restart fastfree-backend-setup.service 2>/dev/null || true
            sleep 5
            systemctl restart caddy
            echo 'Services restarted'
          START

  diagnose:
    name: "Diagnostic — client3"
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run full diagnostic
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          set -e
          IP="${{ secrets.CLIENT3_IP }}"
          USER="root"

          SSH_CMD="sshpass -p '$SSH_PASSWORD' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 $USER@$IP"

          echo "════════════════════════════════════════════════════════"
          echo "  FastFree OS — Diagnostic Report"
          echo "  $(date)"
          echo "════════════════════════════════════════════════════════"
          echo ""

          echo "═══ 1. SYSTEM INFO ═══"
          eval "$SSH_CMD" "hostname; echo '---'; uname -a; echo '---'; uptime; echo '---'; cat /etc/os-release | head -5"
          echo ""

          echo "═══ 2. NETWORK ═══"
          eval "$SSH_CMD" "ip addr show ens18 | grep 'inet '; echo '---'; ip route show default; echo '---'; ping -c 2 -W 3 8.8.8.8 || echo 'PING FAILED'"
          echo ""

          echo "═══ 3. LISTENING PORTS ═══"
          eval "$SSH_CMD" "ss -tlnp | grep -E '(22|80|443|3306|51820|8080|8082|9000|9001|9002|9003|9004|9090)' || echo 'No services listening'"
          echo ""

          echo "═══ 4. PODMAN CONTAINERS ═══"
          eval "$SSH_CMD" "podman ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || echo 'podman not available'"
          echo ""

          echo "═══ 5. PODMAN IMAGES ═══"
          eval "$SSH_CMD" "podman images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' || echo 'No images'"
          echo ""

          echo "═══ 6. SYSTEMD SERVICES ═══"
          eval "$SSH_CMD" "systemctl list-units --type=service --state=running | grep -E '(podman|caddy|mysql|wireguard|avahi|fastfree|cockpit)' || echo 'No FastFree services'"
          echo ""

          echo "═══ 7. FAILED SERVICES ═══"
          eval "$SSH_CMD" "systemctl list-units --type=service --state=failed || echo 'No failed services'"
          echo ""

          echo "═══ 8. CADDY STATUS ═══"
          eval "$SSH_CMD" "systemctl status caddy --no-pager -l | head -15 || echo 'Caddy not running'"
          echo ""

          echo "═══ 9. CADDY ERRORS (last 10) ═══"
          eval "$SSH_CMD" "journalctl -u caddy --no-pager -n 10 --since '2 min ago' 2>&1 || true"
          echo ""

          echo "═══ 10. MARIADB STATUS ═══"
          eval "$SSH_CMD" "mysqladmin ping -h localhost 2>&1 || echo 'MySQL not reachable'"
          echo ""

          echo "═══ 11. WIREGUARD STATUS ═══"
          eval "$SSH_CMD" "wg show || echo 'WireGuard not running'"
          echo ""

          echo "═══ 12. NIXOS GENERATION ═══"
          eval "$SSH_CMD" "nixos-rebuild --version 2>/dev/null || echo 'NixOS not available'"
          echo ""

          echo "═══ 13. DISK USAGE ═══"
          eval "$SSH_CMD" "df -h / /var /tmp 2>/dev/null || df -h"
          echo ""

          echo "═══ 14. HTTP ENDPOINTS (localhost) ═══"
          eval "$SSH_CMD" "
            for port in 80 443 8080 8082 9000 9001 9002 9003 9004 9090; do
              HTTP_CODE=\$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 http://localhost:\$port/ 2>/dev/null || echo '000')
              echo \"  Port \$port: HTTP \$HTTP_CODE\"
            done
          "
          echo ""

          echo "═══ 15. EXTERNAL CURL TESTS ═══"
          for domain in hr.fastfree.cloud erp.fastfree.cloud ledger.fastfree.cloud pos.fastfree.cloud backend.fastfree.cloud fastfree.cloud db.fastfree.cloud panel.fastfree.cloud www.fastfree.cloud; do
            CODE=$(curl -m 5 -sI "https://$domain/" 2>&1 | head -1 || echo "TIMEOUT")
            echo "  $domain: $CODE"
          done
          echo ""

          echo "═══ 16. COCKPIT STATUS ═══"
          eval "$SSH_CMD" "
            systemctl status cockpit.socket --no-pager -l 2>/dev/null | head -10 || echo 'cockpit.socket not found'
            echo '---'
            curl -s -o /dev/null -w 'Cockpit (9090): HTTP %{http_code}' http://localhost:9090/ 2>/dev/null || echo 'Cockpit not reachable'
          "
          echo ""

          echo "═══ 17. RECENT JOURNAL ERRORS ═══"
          eval "$SSH_CMD" "journalctl -p err --no-pager -n 15 2>/dev/null || echo 'journalctl not available'"
          echo ""

          echo "═══ 18. SPA FILES ON HOST ═══"
          eval "$SSH_CMD" "
            for app in hr erp ledger pos; do
              dir=\"/srv/fastfree-\${app}\"
              if [ -d \"\$dir\" ]; then
                echo \"\$dir: \$(ls \"\$dir\" 2>/dev/null | head -5)\"
              else
                echo \"\$dir: MISSING\"
              fi
            done
          "
          echo ""

          echo "════════════════════════════════════════════════════════"
          echo "  Diagnostic Complete"
          echo "════════════════════════════════════════════════════════"
