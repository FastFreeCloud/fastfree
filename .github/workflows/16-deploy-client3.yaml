name: 16-deploy-client3

on:
  workflow_dispatch:

env:
  NODE_OPTIONS: "--no-deprecation"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  update:
    name: "Deploy client3 config via SSH"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5

      - name: "Install Nix"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Deploy via SSH + nixos-rebuild"
        env:
          SSHPASS: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          # Copy flake files to VPS
          sshpass -p "$SSHPASS" scp -o StrictHostKeyChecking=no -r \
            apps/fastfree_os/flake.nix \
            apps/fastfree_os/flake.lock \
            apps/fastfree_os/nix/ \
            root@${{ secrets.CLIENT3_IP }}:/tmp/fastfree_os/

          # Cleanup old SPA containers
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'RESET'
            for svc in hr erp pos ledger; do
              systemctl stop "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
              systemctl reset-failed "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
              systemctl disable "podman-fastfree-${svc}-frontend.service" 2>/dev/null || true
            done
            systemctl daemon-reload
            podman rm -f fastfree-hr-frontend fastfree-erp-frontend fastfree-pos-frontend fastfree-ledger-frontend 2>/dev/null || true
            echo 'Cleanup done'
          RESET

          # Pull SPA images
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'PULL'
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_hr:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_erp:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_pos:latest || true
            podman pull --quiet ghcr.io/fastfreecloud/fastfree_ledger:latest || true
            echo 'All images pulled'
          PULL

          # Extract SPA files from images to host
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'EXTRACT'
            for app in hr erp ledger pos; do
              IMAGE="ghcr.io/fastfreecloud/fastfree_${app}:latest"
              DEST="/srv/fastfree-${app}"
              rm -rf "$DEST"
              mkdir -p "$DEST"
              CID=$(podman create "$IMAGE" 2>/dev/null || true)
              if [ -n "$CID" ]; then
                TMPDIR=$(mktemp -d)
                podman export "$CID" | tar -xf - -C "$TMPDIR"
                SRV_SRC=$(find "$TMPDIR" -maxdepth 5 -type d -name srv -path "*/nix/store/*" | head -1)
                if [ -n "$SRV_SRC" ]; then
                  cp -a "$SRV_SRC"/* "$DEST/"
                  echo "EXTRACTED ${app}: $(ls "$DEST")"
                else
                  echo "FAILED: srv/ directory not found in $IMAGE"
                  find "$TMPDIR" -maxdepth 3 -type d | head -20
                fi
                rm -rf "$TMPDIR"
                podman rm "$CID" >/dev/null 2>&1 || true
              else
                echo "FAILED: Could not create container from $IMAGE"
              fi
            done
          EXTRACT

          # Run nixos-rebuild
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} \
            "cd /tmp/fastfree_os && nixos-rebuild switch --flake .#client3 || true"

          # Reset failed units and restart caddy
          sshpass -p "$SSHPASS" ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.CLIENT3_IP }} << 'START'
            systemctl daemon-reload
            systemctl reset-failed fastfree-backend-websocket.service 2>/dev/null || true
            systemctl reset-failed fastfree-backend-setup.service 2>/dev/null || true
            systemctl restart fastfree-backend-setup.service 2>/dev/null || true
            sleep 5
            systemctl restart caddy
            echo 'Services restarted'
          START

      - name: "Verify"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} \
          "systemctl list-units --type=service --state=running | grep -E 'fastfree|caddy|mariadb' || true"

      - name: "Diagnostic"
        run: |
          sshpass -p "${{ secrets.CLIENT3_ROOT_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          root@${{ secrets.CLIENT3_IP }} << 'DIAG'
          echo "=== SPA FILES ON HOST ==="
          for app in hr erp ledger pos; do
            dir="/srv/fastfree-${app}"
            if [ -d "$dir" ]; then
              echo "$dir: $(ls "$dir" 2>/dev/null | head -5)"
            else
              echo "$dir: MISSING"
            fi
          done
          echo ""
          echo "=== CURL TESTS (host Caddy) ==="
          curl -m 5 -sI https://hr.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: hr"
          curl -m 5 -sI https://erp.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: erp"
          curl -m 5 -sI https://ledger.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: ledger"
          curl -m 5 -sI https://pos.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: pos"
          curl -m 5 -sI https://backend.fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: backend"
          curl -m 5 -sI https://fastfree.cloud/ 2>&1 | head -5 || echo "FAILED: website"
          echo ""
          echo "=== CADDY CONFIG FILE ==="
          cat /etc/caddy/Caddyfile 2>/dev/null | head -40 || echo "NOT FOUND"
          echo ""
          echo "=== CADDY ERRORS (last 10) ==="
          journalctl -u caddy --no-pager -n 10 --since "2 min ago" 2>&1 || true
          echo ""
          echo "=== CADDY SERVICE STATUS ==="
          systemctl status caddy --no-pager 2>&1 | head -15 || true
          echo ""
          echo "=== FAILED SYSTEMD UNITS ==="
          systemctl --failed 2>&1 || true
          echo ""
          echo "=== BACKEND SETUP LOG (last 20) ==="
          journalctl -u fastfree-backend-setup.service --no-pager -n 20 2>&1 || true
          echo ""
          echo "=== BACKEND WEBSOCKET STATUS ==="
          systemctl status podman-fastfree-backend-websocket.service --no-pager 2>&1 | head -15 || true
          DIAG

