name: "Web: FastFree Panel"

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/fastfree_panel/**'
      - 'packages/**'
      - '.github/workflows/web-panel.yaml'
      - '.github/workflows/web-pipeline.yaml'
    tags:
      - 'panel-v*'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/fastfree_panel/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: ./.github/workflows/web-pipeline.yaml
    with:
      app_name: 'FastFree Clan Panel'
      app_key: 'panel'
      app_dir: 'apps/fastfree_panel'
      has_backend: true
      tarball_name: 'fastfree-panel.tar.gz'
    secrets: inherit
