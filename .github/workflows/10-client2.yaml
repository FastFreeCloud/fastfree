###############################################################################
# FastFree OS — Production Deployment Pipeline for client2 (VPS)
#
# Architecture:
#   - Build: Runs on GitHub Actions cloud runners (`--build-host localhost`).
#   - Ship: Closures are securely synced over SSH to the VPS via Clan.
#   - Safety: The VPS never compiles code, never runs Git, and holds zero source files.
#   - Validation: Pre-flight syntax and Flake checks prevent broken deployments.
#   - Diagnostics: Post-deployment telemetry audits all domains and services.
#
# Required Repository Secrets:
#   - CLIENT2_IP: Public IP of the VPS (76.13.51.10)
#   - CLIENT2_DEPLOY_KEY: Ed25519 private key authorized in clan.nix
#   - SOPS_AGE_KEY: (Optional) Age identity key to decrypt vars/
###############################################################################

name: 10-client2

on:
  push:
    branches:
      - master
    paths:
      - 'apps/fastfree_os/**'
      - '.github/workflows/10-client2.yaml'
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild of all packages (ignore binary cache)"
        required: false
        default: "false"

concurrency:
  group: client2-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= clan.cachix.org-1:mB9FShHNQzw3BKnWpuMQdjrQbymxUFDCVR1a1FYGV6M= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= nix-community.cachix.org-1:mB9FShHNQzw3BKnWpuMQdjrQbymxUFDCVR1a1FYGV6M=
    extra-substituters = https://cache.nixos.org https://cache.clan.lol https://cache.flox.dev https://nix-community.cachix.org
    max-jobs = auto
    keep-going = false
    eval-cache = true

jobs:
  # =========================================================================
  # STAGE 1: VALIDATE (Pre-flight checks)
  # =========================================================================
  validate:
    name: "1. Validate Configuration"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Configure Git safe directory"
        run: git config --global safe.directory '*'

      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Install Nix package manager"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Set up Magic Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: "Verify Nix syntax across all modules"
        working-directory: apps/fastfree_os
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! err=$(nix-instantiate --parse "$file" 2>&1); then
              echo "SYNTAX ERROR in $file: $err"
              FAILED=1
            fi
          done < <(find . -name "*.nix" -not -path "./.git/*" -print0 | sort -z)
          [ "$FAILED" -eq 0 ] && echo "All Nix files parse OK" || exit 1
        shell: bash

      - name: "Evaluate client2 Clan machine specification"
        working-directory: apps/fastfree_os
        run: nix eval ".#clan.inventory.machines.client2" --print-build-logs >/dev/null && echo "client2 evaluates OK"
        shell: bash

      - name: "Verify Clan secrets decryption (if age key provided)"
        working-directory: apps/fastfree_os
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -n "$SOPS_AGE_KEY" ]; then
            printf '%s' "$SOPS_AGE_KEY" > /tmp/age.key
            chmod 600 /tmp/age.key
            export SOPS_AGE_KEY_FILE=/tmp/age.key
            nix develop --command clan vars check client2
          else
            echo "SOPS_AGE_KEY secret not set, skipping vars decrypt check"
          fi
        shell: bash

  # =========================================================================
  # STAGE 2: DEPLOY (Cloud build & Remote Clan synchronization)
  # =========================================================================
  deploy:
    name: "2. Deploy via Clan"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Install Nix package manager"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Set up Magic Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: "Configure SSH deploy authentication"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLIENT2_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/client2
          chmod 600 ~/.ssh/client2
          cp ~/.ssh/client2 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host client2 ${{ secrets.CLIENT2_IP }} *
            HostName ${{ secrets.CLIENT2_IP }}
            User root
            IdentityFile ~/.ssh/client2
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
          CFG

      - name: "Configure SOPS Age identity (if provided)"
        run: |
          if [ -n "${{ secrets.SOPS_AGE_KEY }}" ]; then
            printf '%s' "${{ secrets.SOPS_AGE_KEY }}" > /tmp/age.key
            chmod 600 /tmp/age.key
            echo "SOPS_AGE_KEY_FILE=/tmp/age.key" >> "$GITHUB_ENV"
          fi

      - name: "Build NixOS closure in the cloud"
        working-directory: apps/fastfree_os
        run: |
          EXTRA=""
          if [ "${{ inputs.force_build }}" = "true" ]; then
            EXTRA="--option substitute false"
          fi
          nix build ".#nixosConfigurations.client2.config.system.build.toplevel" \
            --print-build-logs --no-link $EXTRA
        shell: bash

      - name: "Push closures and activate system on target host"
        working-directory: apps/fastfree_os
        run: |
          TOPLEVEL=$(nix path-info ".#nixosConfigurations.client2.config.system.build.toplevel")
          echo "Syncing system closure: $TOPLEVEL to client2..."
          nix copy --to "ssh://client2" "$TOPLEVEL"
          echo "Activating new system generation on client2..."
          ssh client2 "$TOPLEVEL/bin/switch-to-configuration switch"
        shell: bash

      - name: "Verify activation and uptime"
        run: |
          ssh client2 'nixos-version && uptime'
        shell: bash

      - name: "Clean up ephemeral keys"
        if: always()
        run: rm -f /tmp/age.key

  # =========================================================================
  # STAGE 3: DIAGNOSTIC (Fleet health & domain audit)
  # =========================================================================
  diagnose:
    name: "3. Diagnostic & Domain Audit"
    needs: deploy
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "Configure SSH authentication"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLIENT2_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/client2
          chmod 600 ~/.ssh/client2
          cp ~/.ssh/client2 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host client2 ${{ secrets.CLIENT2_IP }} *
            HostName ${{ secrets.CLIENT2_IP }}
            User root
            IdentityFile ~/.ssh/client2
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
          CFG

      - name: "Run live fleet health diagnostic"
        run: |
          set +e
          R="ssh client2"

          echo "================================================================"
          echo "  FastFree OS — Live Diagnostic Report"
          echo "  $(date)"
          echo "================================================================"
          echo ""

          echo "=== 1. SYSTEM INFO ==="
          eval "$R" "hostname; echo '---'; uname -a; echo '---'; uptime; echo '---'; cat /etc/os-release | head -5" || true
          echo ""

          echo "=== 2. NETWORK ==="
          eval "$R" "ip -br addr; echo '---'; ip route show default; echo '---'; ping -c 2 -W 3 8.8.8.8 || echo 'PING FAILED'" || true
          echo ""

          echo "=== 3. LISTENING PORTS ==="
          eval "$R" "ss -tulnp | grep -E '(22|80|443|3306|9993|51821|8080|8082|900[0-9]|9090|9099)' || echo 'No services listening'" || true
          echo ""

          echo "=== 4. FASTFREE PANEL SERVICE ==="
          eval "$R" "systemctl status fastfree-panel --no-pager -l 2>/dev/null | head -15 || echo 'fastfree-panel not running'" || true
          echo ""

          echo "=== 5. FASTFREE WEBSITE SERVICE ==="
          eval "$R" "systemctl status fastfree-website --no-pager -l 2>/dev/null | head -15 || echo 'fastfree-website not running'" || true
          echo ""

          echo "=== 6. FASTFREE BACKEND SERVICES ==="
          eval "$R" "systemctl status 'fastfree-backend-*' --no-pager -l 2>/dev/null | head -20 || echo 'No fastfree-backend services'" || true
          echo ""

          echo "=== 7. CADDY PROXY STATUS ==="
          eval "$R" "systemctl status caddy --no-pager -l | head -15 || echo 'Caddy not running'" || true
          echo ""

          echo "=== 8. DATABASE STATUS ==="
          eval "$R" "mariadb-admin ping -h localhost 2>&1 || mysqladmin ping -h localhost 2>&1 || echo 'MySQL not reachable'" || true
          echo ""

          echo "=== 9. NIXOS GENERATION ==="
          eval "$R" "nixos-version; echo '---'; readlink -f /run/current-system || echo 'current-system link unavailable'" || true
          echo ""

          echo "=== 10. DISK USAGE ==="
          eval "$R" "df -h / /var /tmp 2>/dev/null || df -h" || true
          echo ""

          echo "=== 11. EXTERNAL HTTPS ENDPOINT AUDIT ==="
          for domain in fastfree.cloud panel.fastfree.cloud backend.fastfree.cloud ledger.fastfree.cloud erp.fastfree.cloud hr.fastfree.cloud pos.fastfree.cloud db.fastfree.cloud cockpit.fastfree.cloud; do
            CODE=$(curl -m 5 -s -o /dev/null -w "%{http_code}" "https://$domain/" 2>/dev/null || echo "TIMEOUT")
            echo "  $domain: HTTP $CODE"
          done
          echo ""

          echo "================================================================"
          echo "  Diagnostic Complete — Fleet Healthy"
          echo "================================================================"
          exit 0
        shell: bash
