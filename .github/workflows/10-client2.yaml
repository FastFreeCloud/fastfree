###############################################################################
# Client2 pipeline — validate + deploy via Clan + diagnose + guarded fresh install
#
# Design: `clan machines update` builds the NixOS closure ON the GitHub runner
# (`--build-host localhost`) and ships the closure to the VPS over SSH. The VPS
# never compiles Nix — it only receives store paths and runs switch-to-configuration.
#
# The old raw-SCP + `nixos-rebuild` path was replaced because:
#   1. It built on the 4 GB VPS (no swap) — slow and OOM-prone.
#   2. It bypassed Clan vars/sops, so secrets handling was ad-hoc.
#   3. Its podman/SPA steps were duplicated by the Nix modules
#      (systemd.services."fastfree-<app>-spa" already extracts /srv/fastfree-*).
#
# Required repository secrets:
#   CLIENT2_DEPLOY_KEY  — private key whose pubkey is inventory sshd authorizedKeys
#   CLIENT2_IP          — public IP of the VPS
#   SOPS_AGE_KEY        — operator age identity (decrypts vars/ for the build host)
###############################################################################

name: 10-client2

on:
  push:
    branches:
      - master
    paths:
      - 'apps/fastfree_os/**'
      - '.github/workflows/10-client2.yaml'
  workflow_dispatch:
    inputs:
      force_build:
        description: "Ignore binary cache / rebuild everything (slow)"
        required: false
        default: "false"

concurrency:
  group: client2-${{ github.ref }}
  cancel-in-progress: true

env:
  # Binary caches: nixpkgs + clan + flox. Keeps the runner-side build fast.
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= clan.cachix.org-1:mB9FShHNQzw3BKnWpuMQdjrQbymxUFDCVR1a1FYGV6M= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= nix-community.cachix.org-1:mB9FShHNQzw3BKnWpuMQdjrQbymxUFDCVR1a1FYGV6M=
    extra-substituters = https://cache.nixos.org https://cache.clan.lol https://cache.flox.dev https://nix-community.cachix.org
    max-jobs = auto
    keep-going = false

jobs:
  validate:
    name: "1. Validate client2 config"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        uses: actions/checkout@v6

      - name: "3. Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "4. Parse Nix files"
        working-directory: apps/fastfree_os
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! err=$(nix-instantiate --parse "$file" 2>&1); then
              echo "SYNTAX ERROR in $file: $err"
              FAILED=1
            fi
          done < <(find . -name "*.nix" -not -path "./.git/*" -print0 | sort -z)
          [ "$FAILED" -eq 0 ] && echo "All Nix files parse OK" || exit 1
        shell: bash

      - name: "5. Evaluate client2 toplevel"
        working-directory: apps/fastfree_os
        run: nix eval ".#clan.inventory.machines.client2" --print-build-logs >/dev/null && echo "client2 evaluates OK"
        shell: bash

      - name: "6. Verify Clan vars decrypt"
        working-directory: apps/fastfree_os
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -n "$SOPS_AGE_KEY" ]; then
            printf '%s' "$SOPS_AGE_KEY" > /tmp/age.key
            chmod 600 /tmp/age.key
            export SOPS_AGE_KEY_FILE=/tmp/age.key
            nix develop --command clan vars check client2
          else
            echo "SOPS_AGE_KEY secret not set, skipping vars decrypt check"
          fi
        shell: bash

  deploy:
    name: "2. Deploy client2 via Clan"
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v6

      - name: "2. Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "3. Setup SSH deploy key"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLIENT2_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/client2
          chmod 600 ~/.ssh/client2
          cp ~/.ssh/client2 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host client2 ${{ secrets.CLIENT2_IP }} *
            HostName ${{ secrets.CLIENT2_IP }}
            User root
            IdentityFile ~/.ssh/client2
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
          CFG

      - name: "4. Setup sops age identity"
        run: |
          if [ -n "${{ secrets.SOPS_AGE_KEY }}" ]; then
            printf '%s' "${{ secrets.SOPS_AGE_KEY }}" > /tmp/age.key
            chmod 600 /tmp/age.key
            echo "SOPS_AGE_KEY_FILE=/tmp/age.key" >> "$GITHUB_ENV"
          fi

      - name: "5. Build closure on runner"
        working-directory: apps/fastfree_os
        run: |
          EXTRA=""
          if [ "${{ inputs.force_build }}" = "true" ]; then
            EXTRA="--option system.build.buildLoop=false"
          fi
          nix build ".#nixosConfigurations.client2.config.system.build.toplevel" \
            --print-build-logs --no-link $EXTRA
        shell: bash

      - name: "6. Deploy with Clan"
        working-directory: apps/fastfree_os
        run: |
          nix develop --command clan machines update client2 \
            --build-host localhost \
            --target-host "root@${{ secrets.CLIENT2_IP }}" \
            --host-key-check accept-new
        shell: bash

      - name: "7. Wait for boot"
        run: |
          ssh client2 'nixos-version && uptime'
        shell: bash

      - name: "8. Remove age key"
        if: always()
        run: rm -f /tmp/age.key

  diagnose:
    name: "3. Diagnostic — client2"
    needs: [deploy]
    if: ${{ always() && (github.event_name == 'push' || inputs.action == 'deploy') }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "1. Setup SSH deploy key"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLIENT2_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/client2
          chmod 600 ~/.ssh/client2
          cp ~/.ssh/client2 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host client2 ${{ secrets.CLIENT2_IP }} *
            HostName ${{ secrets.CLIENT2_IP }}
            User root
            IdentityFile ~/.ssh/client2
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
          CFG

      - name: "2. Run full diagnostic"
        run: |
          set -e
          R="ssh client2"

          echo "================================================================"
          echo "  FastFree OS — Diagnostic Report"
          echo "  $(date)"
          echo "================================================================"
          echo ""

          echo "=== 1. SYSTEM INFO ==="
          eval "$R" "hostname; echo '---'; uname -a; echo '---'; uptime; echo '---'; cat /etc/os-release | head -5"
          echo ""

          echo "=== 2. NETWORK ==="
          eval "$R" "ip -br addr; echo '---'; ip route show default; echo '---'; ping -c 2 -W 3 8.8.8.8 || echo 'PING FAILED'"
          echo ""

          echo "=== 3. ZEROTIER ==="
          eval "$R" "ip -br addr show zt0 2>/dev/null || echo 'zt0: absent'; echo '---'; zerotier-cli listnetworks 2>/dev/null || echo 'zerotier-cli: absent'"
          echo ""

          echo "=== 4. LISTENING PORTS ==="
          eval "$R" "ss -tulnp | grep -E '(22|80|443|3306|9993|51821|8080|8082|900[0-9]|9090)' || echo 'No services listening'"
          echo ""

          echo "=== 5. FASTFREE BACKEND SERVICES ==="
          eval "$R" "systemctl status 'fastfree-backend-*' --no-pager -l 2>/dev/null || echo 'No fastfree-backend services'"
          echo ""

          echo "=== 6. FASTFREE PANEL STATUS ==="
          eval "$R" "systemctl status fastfree-panel --no-pager -l 2>/dev/null || echo 'fastfree-panel not running'"
          echo ""

          echo "=== 7. SYSTEMD SERVICES ==="
          eval "$R" "systemctl list-units --type=service --state=running | grep -E '(caddy|mysql|mariadb|wireguard|avahi|fastfree|cockpit)' || echo 'No FastFree services'"
          echo ""

          echo "=== 8. FAILED SERVICES ==="
          eval "$R" "systemctl list-units --type=service --state=failed || echo 'No failed services'"
          echo ""

          echo "=== 9. CADDY STATUS ==="
          eval "$R" "systemctl status caddy --no-pager -l | head -15 || echo 'Caddy not running'"
          echo ""

          echo "=== 10. CADDY ERRORS (last 10) ==="
          eval "$R" "journalctl -u caddy --no-pager -n 10 --since '2 min ago' 2>&1 || true"
          echo ""

          echo "=== 11. MARIADB STATUS ==="
          eval "$R" "mysqladmin ping -h localhost 2>&1 || echo 'MySQL not reachable'"
          echo ""

          echo "=== 12. WIREGUARD STATUS ==="
          eval "$R" "wg show || echo 'WireGuard not running'"
          echo ""

          echo "=== 13. NIXOS GENERATION ==="
          eval "$R" "nixos-version; echo '---'; readlink /run/current-system; echo '---'; bootctl list --no-pager 2>/dev/null | head -10 || echo 'no systemd-boot'"
          echo ""

          echo "=== 14. DISK USAGE ==="
          eval "$R" "df -h / /var /tmp 2>/dev/null || df -h"
          echo ""

          echo "=== 15. HTTP ENDPOINTS (localhost) ==="
          eval "$R" "
            for port in 80 443 8080 8082 9000 9001 9002 9003 9004 9090; do
              HTTP_CODE=\$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 http://localhost:\$port/ 2>/dev/null || echo '000')
              echo \"  Port \$port: HTTP \$HTTP_CODE\"
            done
          "
          echo ""

          echo "=== 16. EXTERNAL CURL TESTS ==="
          for domain in hr.fastfree.cloud erp.fastfree.cloud ledger.fastfree.cloud pos.fastfree.cloud backend.fastfree.cloud fastfree.cloud db.fastfree.cloud panel.fastfree.cloud www.fastfree.cloud; do
            CODE=$(curl -m 5 -sI "https://$domain/" 2>&1 | head -1 || echo "TIMEOUT")
            echo "  $domain: $CODE"
          done
          echo ""

          echo "=== 17. COCKPIT STATUS ==="
          eval "$R" "
            systemctl status cockpit.socket --no-pager -l 2>/dev/null | head -10 || echo 'cockpit.socket not found'
            echo '---'
            curl -s -o /dev/null -w 'Cockpit (9090): HTTP %{http_code}' http://localhost:9090/ 2>/dev/null || echo 'Cockpit not reachable'
          "
          echo ""

          echo "=== 18. RECENT JOURNAL ERRORS ==="
          eval "$R" "journalctl -p err --no-pager -n 15 2>/dev/null || echo 'journalctl not available'"
          echo ""

          echo "=== 19. SPA FILES ON HOST ==="
          eval "$R" "
            for app in hr erp ledger pos; do
              dir=\"/srv/fastfree-\${app}\"
              if [ -d \"\$dir\" ]; then
                echo \"\$dir: \$(ls \"\$dir\" 2>/dev/null | head -5)\"
              else
                echo \"\$dir: MISSING\"
              fi
            done
          "
          echo ""

          echo "================================================================"
          echo "  Diagnostic Complete"
          echo "================================================================"


