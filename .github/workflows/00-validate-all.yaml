name: 00-validate-all

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate All Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check fastfree_pos TypeScript
        working-directory: apps/fastfree_pos
        run: pnpm exec vue-tsc --noEmit

      - name: Check fastfree_pos Lint
        working-directory: apps/fastfree_pos
        run: pnpm run lint:check

      - name: Check fastfree_erp TypeScript
        working-directory: apps/fastfree_erp
        run: pnpm exec vue-tsc --noEmit

      - name: Check fastfree_erp Lint
        working-directory: apps/fastfree_erp
        run: pnpm run lint:check

      - name: Check fastfree_hr TypeScript
        working-directory: apps/fastfree_hr
        run: pnpm exec vue-tsc --noEmit

      - name: Check fastfree_hr Lint
        working-directory: apps/fastfree_hr
        run: pnpm run lint:check

      - name: Check fastfree_ledger TypeScript
        working-directory: apps/fastfree_ledger
        run: pnpm exec vue-tsc --noEmit

      - name: Check fastfree_ledger Lint
        working-directory: apps/fastfree_ledger
        run: pnpm run lint:check
