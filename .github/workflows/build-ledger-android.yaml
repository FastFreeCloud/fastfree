name: build-ledger-android

on:
  push:
    branches: [main, master]
    paths:
      - "apps/fastfree_ledger/**"
      - ".github/workflows/build-ledger-android.yaml"
  workflow_dispatch:

concurrency:
  group: build-ledger-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: fastfree_ledger
  APP_NAME: "FastFree Ledger"
  APP_ID: com.fastfree.ledger
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.11.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare Quasar
        working-directory: apps/${{ env.APP_DIR }}
        run: |
          mkdir -p .quasar
          echo '{"compilerOptions":{}}' > .quasar/tsconfig.json
          pnpm exec quasar prepare --silent

      - name: Build web assets
        working-directory: apps/${{ env.APP_DIR }}
        run: pnpm exec quasar build

      - name: Install Capacitor dependencies
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npm install

      - name: Sync Capacitor
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npx cap sync android

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release APK
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=app/release.keystore \
              -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
          else
            echo "No keystore found, building debug APK"
            ./gradlew assembleDebug
          fi

      - name: Collect APK
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: |
          mkdir -p ../../dist-apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../../dist-apk/fastfree-ledger.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../../dist-apk/fastfree-ledger.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fastfree-ledger-apk
          path: apps/${{ env.APP_DIR }}/dist-apk/fastfree-ledger.apk
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fastfree-ledger-apk
          path: release

      - name: Get version
        id: version
        run: |
          VERSION=$(date +%Y.%m.%d)-$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ledger-v${{ steps.version.outputs.version }}
          name: "FastFree Ledger v${{ steps.version.outputs.version }}"
          files: release/fastfree-ledger.apk
          generate_release_notes: true
