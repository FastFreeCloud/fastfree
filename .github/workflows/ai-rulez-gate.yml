name: AI-Rulez Quality & Drift Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  governance-gate:
    name: AI-Rulez Verification & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Generated Outputs Sync (Zero Drift)
        run: |
          npx -y ai-rulez@latest generate --check --debug || {
            echo "::error::ai-rulez generate --check failed. Diagnostic output:"
            echo "=== BEFORE REGEN: TAIL .gitignore ==="
            tail -n 15 .gitignore
            npx -y ai-rulez@latest generate --debug
            echo "=== AFTER REGEN: TAIL .gitignore ==="
            tail -n 15 .gitignore
            echo "=== GIT STATUS ==="
            git status
            echo "=== GIT DIFF ==="
            git diff
            exit 2
          }

      - name: Verify Lockfile Status
        run: npx -y ai-rulez@latest lock --check

      - name: Run Strict Validation
        run: npx -y ai-rulez@latest validate --strict --outputs

      - name: Run Deterministic Verifiers
        run: npx -y ai-rulez@latest verifiers run --strict

      - name: AI-Rulez Health Diagnostics
        run: npx -y ai-rulez@latest doctor