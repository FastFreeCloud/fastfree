###############################################################################
# Client1 pipeline — validate + build WSL image (Windows Subsystem for Linux)
# Replaces: 13-validate-os.yaml (client1 leg) + 14-build-client1.yaml
###############################################################################

name: 08-client1

on:
  workflow_dispatch:

concurrency:
  group: client1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "1. Validate client1 config"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        uses: actions/checkout@v6

      - name: "3. Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: "4. Parse Nix files"
        working-directory: apps/fastfree_os
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! nix-instantiate --parse "$file" >/dev/null 2>&1; then
              echo "SYNTAX ERROR: $file"
              FAILED=1
            fi
          done < <(find . -name "*.nix" -not -path "./.git/*" -print0 | sort -z)
          [ "$FAILED" -eq 0 ] && echo "All Nix files parse OK" || exit 1
        shell: bash

      - name: "5. Evaluate client1 toplevel"
        working-directory: apps/fastfree_os
        run: nix eval --extra-experimental-features 'nix-command flakes' ".#nixosConfigurations.client1.config.system.build.toplevel" --no-update-lock-file --print-build-logs >/dev/null && echo "client1 evaluates OK"
        shell: bash

  build-wsl:
    name: "2. Build WSL image"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: "1. Free disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af --filter "until=24h"
          echo "Disk space after cleanup: $(df -h / | tail -1 | awk '{print $4}')"
        shell: bash

      - name: "2. Safe directory"
        run: git config --global safe.directory '*'

      - name: "3. Checkout"
        uses: actions/checkout@v6

      - name: "4. Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: "5. Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: "6. Build WSL tarball builder"
        working-directory: apps/fastfree_os
        run: |
          echo "Building WSL tarball for client1..."
          nix build .#packages.x86_64-linux.client1 \
            --out-link ./result-builder \
            --print-build-logs --no-update-lock-file --extra-experimental-features 'nix-command flakes'
          echo "WSL tarball builder built"

      - name: "7. Pre-build NixOS system closure"
        working-directory: apps/fastfree_os
        run: |
          echo "Building NixOS system closure for client1..."
          nix build .#nixosConfigurations.client1.config.system.build.toplevel \
            --print-build-logs --no-update-lock-file --extra-experimental-features 'nix-command flakes'
          echo "System closure built"

      - name: "8. Create WSL tarball"
        working-directory: apps/fastfree_os
        run: |
          echo "Creating WSL tarball..."
          cp -r ./result-builder/bin/nixos-wsl-tarball-builder ./tarball-builder
          chmod +x ./tarball-builder
          sudo ./tarball-builder fastfree_client1.wsl
          echo "WSL tarball created"
          ls -lh fastfree_client1.wsl

      - name: "9. Compress WSL tarball (7z)"
        working-directory: apps/fastfree_os
        run: |
          echo "Compressing WSL tarball..."
          sudo apt-get update && sudo apt-get install -y p7zip-full
          WSL_PASS="${{ secrets.WSL_ARCHIVE_PASSWORD }}"
          WSL_PASS="${WSL_PASS:-FastOS@2026}"
          7z a -t7z -m0=lzma2 -mx=9 -p"$WSL_PASS" -mhe=on \
            fastfree_client1.wsl.7z fastfree_client1.wsl
          echo "WSL archive created"
          ls -lh fastfree_client1.wsl.7z

      - name: "10. Upload WSL artifact"
        uses: actions/upload-artifact@v7
        with:
          name: fastfree_client1.wsl.7z
          path: apps/fastfree_os/fastfree_client1.wsl.7z
          retention-days: 30
