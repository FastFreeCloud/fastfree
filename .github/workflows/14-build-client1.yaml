###############################################################################
# بناء صورة WSL — FastFree OS for Windows Subsystem for Linux (client1)
###############################################################################

name: 14-build-client1

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-client1-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--no-deprecation"
  WSL_CLIENT: client1
  WSL_TARBALL: fastfree_client1.wsl
  WSL_ARCHIVE: fastfree_client1.wsl.7z

jobs:
  build-wsl:
    name: 🪟 بناء صورة WSL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af --filter "until=24h"
          echo "Disk space after cleanup: $(df -h / | tail -1 | awk '{print $4}')"
        shell: bash

      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build WSL tarball builder
        working-directory: apps/fastfree_os
        run: |
          echo "Building WSL tarball for ${{ env.WSL_CLIENT }}..."
          nix build .#packages.x86_64-linux.${{ env.WSL_CLIENT }} \
            --out-link ./result-builder \
            --print-build-logs --no-update-lock-file
          echo "WSL tarball builder built"

      - name: Pre-build NixOS system closure
        working-directory: apps/fastfree_os
        run: |
          echo "Building NixOS system closure for ${{ env.WSL_CLIENT }}..."
          nix build .#nixosConfigurations.${{ env.WSL_CLIENT }}.config.system.build.toplevel \
            --print-build-logs --no-update-lock-file
          echo "System closure built"

      - name: Create WSL tarball
        working-directory: apps/fastfree_os
        run: |
          echo "Creating WSL tarball..."
          cp -r ./result-builder/bin/nixos-wsl-tarball-builder ./tarball-builder
          chmod +x ./tarball-builder
          sudo ./tarball-builder ${{ env.WSL_TARBALL }}
          echo "WSL tarball created"
          ls -lh ${{ env.WSL_TARBALL }}

      - name: Compress WSL tarball (7z)
        working-directory: apps/fastfree_os
        run: |
          echo "Compressing WSL tarball..."
          sudo apt-get update && sudo apt-get install -y p7zip-full
          7z a -t7z -m0=lzma2 -mx=9 -p"FastOS@2026" -mhe=on \
            ${{ env.WSL_ARCHIVE }} ${{ env.WSL_TARBALL }}
          echo "WSL archive created"
          ls -lh ${{ env.WSL_ARCHIVE }}
          echo "SIZE=$(stat --printf='%s' ${{ env.WSL_ARCHIVE }})" >> "$GITHUB_ENV"

      - name: Upload WSL artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WSL_ARCHIVE }}
          path: apps/fastfree_os/${{ env.WSL_ARCHIVE }}
          retention-days: 30

