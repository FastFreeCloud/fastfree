###############################################################################
# FastFree OS — نشر سيرفر client2 (VPS) يدوياً (7_fastos_client2)   [ملف واحد]
#
# طريقة العمل:
#   1. البناء بيتم على سيرفرات GitHub (مش على الـ VPS).
#   2. النتيجة بتتنقل للـ VPS عبر SSH ويتم تفعيلها.
#   3. الـ VPS مفيهوش كود مصدري ولا Git ولا بيعمل compile.
#   4. بعد النشر: مرحلة منفصلة لفحص صحة الخدمات والنطاقات.
#   5. التشغيل يدوي فقط (workflow_dispatch) لمنع أي بناء تلقائي.
#
# الأسرار المطلوبة (Settings → Secrets and variables → Actions → Secrets):
#   CLIENT2_IP          عنوان IP للسيرفر
#   CLIENT2_DEPLOY_KEY  المفتاح الخاص (Ed25519) المصرّح له في clan.nix
#   SOPS_AGE_KEY        (اختياري) مفتاح age لفك تشفير vars/
#
# متغير اختياري (… → Variables):
#   NIX_CACHE_ENABLED=true   تفعيل الـ cache المجاني (شوف الشرح عند خطوة "cache")
#
# مكان التعديلات الشائعة:
#   - اسم الجهاز / مجلد المشروع ........ قسم env (MACHINE, SOURCE_DIR)
#   - إضافة نطاق للفحص ................. مرحلة "فحص الصحة" (قائمة DOMAINS)
#   - إعدادات الـ cache ................ خطوة "cache" و NIX_CONFIG
###############################################################################

name: 7_fastos_client2

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "إعادة بناء كل الحزم من المصدر (يتجاهل الـ cache). تحذير: ممكن ياخد ساعات!"
        type: boolean
        default: false

# النشر بيتنفذ بالدور: لو في نشر شغال، الجديد يستنى ولا يلغيه
# (إلغاء نشر في نص التفعيل ممكن يسيب السيرفر في حالة غير مكتملة)
concurrency:
  group: 7_fastos_client2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # --- إعدادات المشروع (غيّرها هنا فقط) ---
  MACHINE: client2
  SOURCE_DIR: apps/fastfree_os

  # --- إعدادات Nix ---
  # accept-flake-config: بيقبل إعدادات الـ cache المكتوبة جوه الـ flake نفسه (شيله لو مش محتاجه).
  # المفاتيح العامة لازم تكون مطابقة حرفاً بحرف، أي غلطة = الـ cache بيتتجاهل.
  # cache.clan.lol متشالة لأن المفتاح القديم كان غلط. لو عايزها، خد
  # المفتاح الصحيح من docs.clan.lol وضيف الـ substituter والمفتاح معاً.
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    extra-substituters = https://cache.nixos.org https://nix-community.cachix.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
    max-jobs = auto
    keep-outputs = true

jobs:
  # =========================================================================
  # المرحلة 1: فحص + بناء + نشر
  # (مجمّعة في job واحد عشان ما نثبّت Nix ونحمّل الحزم مرتين)
  # =========================================================================
  deploy:
    name: "فحص وبناء ونشر client2"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write   # مطلوب لـ Magic Nix Cache عبر GitHub Actions Cache API
    defaults:
      run:
        shell: bash

    steps:
      # ======================= 1. التجهيز =======================
      - name: "سحب الكود"
        uses: actions/checkout@v5

      # الـ runner المجاني فيه ~14GB بس، وإعدادات NixOS الكبيرة ممكن تاخد 10-15GB
      - name: "تفريغ مساحة على الـ runner"
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
          large-packages: false   # بياخد دقايق كتير مقابل مساحة قليلة

      - name: "تثبيت Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # كاش تلقائي سريع عبر GitHub Actions Cache المدمج (بدون حسابات خارجية)
      - name: "Set up Magic Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # إعداد SSH بنكتبه مرة واحدة هنا ونستخدمه في النشر والفحص
      - name: "إعداد SSH"
        env:
          DEPLOY_KEY: ${{ secrets.CLIENT2_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.CLIENT2_IP }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::error::السر CLIENT2_DEPLOY_KEY أو CLIENT2_IP فاضي. راجع Settings → Secrets."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            printf 'Host %s %s\n' "$MACHINE" "$DEPLOY_HOST"
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User root\n'
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  ServerAliveInterval 60\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # ======================= 2. الفحص المبدئي =======================
      - name: "فحص صياغة ملفات Nix"
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! err=$(nix-instantiate --parse "$file" 2>&1 >/dev/null); then
              echo "::error file=${file#./}::خطأ في الصياغة: $err"
              failed=1
            fi
          done < <(find . -name '*.nix' -not -path './.git/*' -print0 | sort -z)
          [ "$failed" -eq 0 ] && echo "كل ملفات Nix سليمة" || exit 1

      - name: "فحص إعداد الجهاز في Clan"
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          nix eval ".#clan.inventory.machines.${MACHINE}" --print-build-logs >/dev/null
          echo "${MACHINE}: الإعداد سليم"

      - name: "تجهيز مفتاح SOPS (لو موجود)"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -n "$SOPS_AGE_KEY" ]; then
            umask 077
            printf '%s' "$SOPS_AGE_KEY" > "$RUNNER_TEMP/age.key"
            echo "SOPS_AGE_KEY_FILE=$RUNNER_TEMP/age.key" >> "$GITHUB_ENV"
          else
            echo "SOPS_AGE_KEY غير مضبوط، هنتخطى فحص فك التشفير"
          fi

      - name: "فحص فك تشفير أسرار Clan"
        if: ${{ env.SOPS_AGE_KEY_FILE != '' }}
        working-directory: ${{ env.SOURCE_DIR }}
        run: nix develop --command clan vars check "${MACHINE}"

      # ======================= 3. البناء =======================
      - name: "بناء نظام NixOS"
        id: build
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$FORCE_BUILD" = "true" ]; then
            extra+=(--option substitute false)
          fi

          # --out-link بدل --no-link: بيحمي الناتج من الـ garbage collection،
          # وبيدينا المسار مباشرة من غير ما نعيد تقييم الـ flake مرة تانية.
          nix build ".#nixosConfigurations.${MACHINE}.config.system.build.toplevel" \
            --print-build-logs --out-link "$RUNNER_TEMP/system" "${extra[@]}"

          toplevel="$(readlink -f "$RUNNER_TEMP/system")"
          echo "toplevel=$toplevel" >> "$GITHUB_OUTPUT"
          echo "تم البناء: $toplevel"

      # ======================= 4. النشر =======================
      - name: "نقل النظام للسيرفر وتفعيله"
        env:
          TOPLEVEL: ${{ steps.build.outputs.toplevel }}
        run: |
          set -euo pipefail

          # --substitute-on-destination: السيرفر نفسه ينزّل اللي يقدر عليه
          # من cache.nixos.org بدل ما نرفعه من الـ runner (أسرع بكتير).
          echo "نقل النظام إلى ${MACHINE}..."
          nix copy --substitute-on-destination --to "ssh://${MACHINE}" "$TOPLEVEL"

          # تسجيل الإصدار الجديد في system profile (عشان rollback وقائمة الإقلاع)
          ssh "$MACHINE" "nix-env -p /nix/var/nix/profiles/system --set '$TOPLEVEL'"

          echo "تفعيل النظام الجديد..."
          ssh "$MACHINE" "'$TOPLEVEL/bin/switch-to-configuration' switch || [ \$? -eq 4 ]"

      - name: "التأكد من التفعيل"
        env:
          TOPLEVEL: ${{ steps.build.outputs.toplevel }}
        run: |
          set -euo pipefail
          ssh "$MACHINE" 'nixos-version; uptime'
          current="$(ssh "$MACHINE" 'readlink -f /run/current-system')"
          if [ "$current" != "$TOPLEVEL" ]; then
            echo "::error::النظام الشغال ($current) مختلف عن المبني ($TOPLEVEL)"
            exit 1
          fi
          echo "النظام الشغال على السيرفر هو اللي اتبنى الآن"

      # ======================= 5. التنظيف =======================
      - name: "حذف المفاتيح المؤقتة"
        if: always()
        run: rm -f "$RUNNER_TEMP/age.key" ~/.ssh/deploy_key

  # ===========================================================================
  # المرحلة 2: فحص الصحة بعد النشر
  # job منفصل عشان تظهر كمرحلة مستقلة في الـ graph. مش محتاج Nix فبيخلص بسرعة.
  # بيشتغل حتى لو النشر فشل (عشان نعرف حالة السيرفر)، ما عدا لو اتلغى.
  # ===========================================================================
  diagnose:
    name: "فحص الصحة"
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: "إعداد SSH"
        env:
          DEPLOY_KEY: ${{ secrets.CLIENT2_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.CLIENT2_IP }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::error::السر CLIENT2_DEPLOY_KEY أو CLIENT2_IP فاضي. راجع Settings → Secrets."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            printf 'Host %s %s\n' "$MACHINE" "$DEPLOY_HOST"
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User root\n'
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  ServerAliveInterval 60\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

            # لإضافة نطاق للفحص: ضيفه في قائمة DOMAINS.
      # لجعل الخطوة تفشل لو نطاق وقع: غيّر STRICT إلى "1".
      - name: "فحص الصحة بعد النشر"
        env:
          STRICT: "0"
        run: |
          set -uo pipefail   # بدون -e عن قصد: التقرير يكمل حتى لو فحص فشل

          DOMAINS=(
            fastfree.cloud
            panel.fastfree.cloud
            backend.fastfree.cloud
            ledger.fastfree.cloud
            erp.fastfree.cloud
            hr.fastfree.cloud
            pos.fastfree.cloud
            db.fastfree.cloud
            cockpit.fastfree.cloud
          )
          PORTS_REGEX='(22|80|443|3306|9993|51821|8080|8082|900[0-9]|9090|9099)'

          section() { printf '\n=== %s ===\n' "$1"; }
          remote()  { ssh -o BatchMode=yes -o ConnectTimeout=15 "$MACHINE" "$@"; }

          printf 'FastFree OS - Diagnostic Report - %s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"

          if ! remote true; then
            echo "::error::تعذّر الاتصال بالسيرفر عبر SSH"
            exit 1
          fi

          section "SYSTEM"
          remote "hostname; uname -sr; uptime; nixos-version; readlink -f /run/current-system" || echo "(failed)"

          section "NETWORK"
          remote "ip -br addr; ip route show default; ping -c 2 -W 3 8.8.8.8 || echo 'PING FAILED'" || echo "(failed)"

          section "LISTENING PORTS"
          remote "ss -tulnp | grep -E '${PORTS_REGEX}' || echo 'No expected services listening'" || echo "(failed)"

          section "FASTFREE SERVICES"
          remote "systemctl status fastfree-panel --no-pager -l 2>&1 | head -n 15" || echo "(failed)"
          remote "systemctl status fastfree-website --no-pager -l 2>&1 | head -n 15" || echo "(failed)"
          remote "systemctl status 'fastfree-backend-*' --no-pager -l 2>&1 | head -n 20" || echo "(failed)"

          section "CADDY"
          remote "systemctl status caddy --no-pager -l 2>&1 | head -n 15" || echo "(failed)"

          section "DATABASE"
          remote "mariadb-admin ping -h localhost 2>&1 || mysqladmin ping -h localhost 2>&1 || echo 'MySQL not reachable'" || echo "(failed)"

          section "DISK"
          remote "df -h / /var /tmp 2>/dev/null || df -h" || echo "(failed)"

          section "EXTERNAL HTTPS AUDIT"
          unhealthy=0
          for domain in "${DOMAINS[@]}"; do
            code=$(curl -m 5 -s -o /dev/null -w '%{http_code}' "https://${domain}/" 2>/dev/null || true)
            code="${code:-000}"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              status="DOWN"
              unhealthy=$((unhealthy + 1))
              echo "::warning::${domain} لا يستجيب بشكل سليم (HTTP ${code})"
            else
              status="OK"
            fi
            printf '  %-28s HTTP %s  %s\n' "$domain" "$code" "$status"
          done

          echo
          if [ "$unhealthy" -eq 0 ]; then
            echo "RESULT: all ${#DOMAINS[@]} domains responding"
          else
            echo "RESULT: ${unhealthy} of ${#DOMAINS[@]} domains NOT healthy"
          fi

          if [ "$STRICT" = "1" ] && [ "$unhealthy" -gt 0 ]; then
            exit 1
          fi

      - name: "حذف المفاتيح المؤقتة"
        if: always()
        run: rm -f ~/.ssh/deploy_key
