###############################################################################
# اختبارات FastFree OS — فحص شامل واحترافي لنظام NixOS
###############################################################################

name: 11-build-os

on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  المرحلة 1: فحص النحو
  # ═══════════════════════════════════════════════════════════════
  syntax_check:
    name: ⚡ فحص النحو
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: تأمين صلاحيات Git
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: فحص صحة جميع ملفات .nix
        run: |
          FAILED=0
          PASSED=0
          TOTAL=0

          while IFS= read -r -d '' file; do
            TOTAL=$((TOTAL + 1))
            echo -n "  فحص $file ... "
            if ERROR=$(nix-instantiate --parse "$file" 2>&1 >/dev/null); then
              echo "✅ صحيح"
              PASSED=$((PASSED + 1))
            else
              echo "❌ خطأ في الصياغة"
              echo "$ERROR" | head -5 | sed 's/^/    /'
              FAILED=$((FAILED + 1))
            fi
          done < <(find . -name "*.nix" -not -name "cli.nix" -not -path "./.git/*" -print0 | sort -z)

          echo ""
          echo "  الملفات الصحيحة: $PASSED / $TOTAL"
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ فشل — $FAILED ملفات بها أخطاء"
            exit 1
          fi
          echo "✅ جميع ملفات .nix صحيحة"
        shell: bash

  # ═══════════════════════════════════════════════════════════════
  #  المرحلة 1: فحص الـ Flake
  # ═══════════════════════════════════════════════════════════════
  flake_validate:
    name: 📦 فحص الـ Flake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: تأمين صلاحيات Git
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: فحص وجود الملفات الأساسية
        run: |
          REQUIRED=(
            "apps/fastfree_os/flake.nix"
            "apps/fastfree_os/nix/options.nix"
            "apps/fastfree_os/nix/modules/base.nix"
            "apps/fastfree_os/nix/modules/mariadb.nix"
            "apps/fastfree_os/nix/modules/caddy.nix"
            "apps/fastfree_os/nix/modules/fastfree_backend.nix"
            "apps/fastfree_os/nix/modules/fastfree_ledger.nix"
            "apps/fastfree_os/nix/modules/fastfree_erp.nix"
            "apps/fastfree_os/nix/modules/fastfree_hr.nix"
            "apps/fastfree_os/nix/modules/fastfree_pos.nix"
            "apps/fastfree_os/nix/modules/fastfree_website.nix"
            "apps/fastfree_os/nix/modules/phpmyadmin.nix"
            "apps/fastfree_os/nix/modules/wireguard.nix"
            "apps/fastfree_os/nix/modules/avahi-subdomains.nix"
            "apps/fastfree_os/nix/clients/client1.nix"
            "apps/fastfree_os/nix/clients/client2.nix"
            "apps/fastfree_os/nix/clients/client3.nix"
          )

          MISSING=0
          for item in "${REQUIRED[@]}"; do
            echo -n "  $item ... "
            if [ -e "$item" ]; then echo "✅"; else echo "❌"; MISSING=$((MISSING + 1)); fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "❌ يوجد $MISSING ملفات مفقودة"
            exit 1
          fi
          echo "✅ جميع الملفات موجودة"
        shell: bash

      - name: "فحص Flake — nix flake check --no-build"
        working-directory: apps/fastfree_os
        run: |
          if nix flake check --no-build --no-update-lock-file 2>&1; then
            echo "✅ فحص Flake ناجح"
          else
            echo "❌ فشل فحص Flake"
            exit 1
          fi
        shell: bash

      - name: "عرض هيكل الـ Flake"
        working-directory: apps/fastfree_os
        run: nix flake show --no-update-lock-file 2>&1
        shell: bash

  # ═══════════════════════════════════════════════════════════════
  #  المرحلة 1: تقييم التكوينات
  # ═══════════════════════════════════════════════════════════════
  evaluation:
    name: 🔧 تقييم التكوينات
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: تأمين صلاحيات Git
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: تقييم جميع تكوينات NixOS
        working-directory: apps/fastfree_os
        run: |
          CONFIGS=("client1" "client2" "client3")
          FAILED=0
          for config in "${CONFIGS[@]}"; do
            echo -n "  تقييم $config ... "
            if nix eval ".#nixosConfigurations.$config.config.system.build.toplevel" \
              --no-update-lock-file 2>&1; then
              echo "✅"
            else
              echo "❌"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ فشل تقييم $FAILED تكوينات"
            exit 1
          fi
          echo "✅ جميع التكوينات صحيحة"
        shell: bash

  # ═══════════════════════════════════════════════════════════════
  #  المرحلة 2: بناء صور Docker
  # ═══════════════════════════════════════════════════════════════
  build_backend_image:
    name: 🐳 بناء صورة Backend
    uses: ./.github/workflows/build-backend.yaml
    needs: [syntax_check, flake_validate, evaluation]
    if: always() && !cancelled() && needs.evaluation.result == 'success'
    secrets: inherit
    permissions:
      contents: write
      packages: write

  build_erp_image:
    name: 🐳 بناء صورة ERP
    uses: ./.github/workflows/build-erp.yaml
    needs: [syntax_check, flake_validate, evaluation]
    if: always() && !cancelled() && needs.evaluation.result == 'success'
    secrets: inherit
    permissions:
      contents: write
      packages: write

  build_ledger_image:
    name: 🐳 بناء صورة Ledger
    uses: ./.github/workflows/build-ledger.yaml
    needs: [syntax_check, flake_validate, evaluation]
    if: always() && !cancelled() && needs.evaluation.result == 'success'
    secrets: inherit
    permissions:
      contents: write
      packages: write

  build_hr_image:
    name: 🐳 بناء صورة HR
    uses: ./.github/workflows/build-hr.yaml
    needs: [syntax_check, flake_validate, evaluation]
    if: always() && !cancelled() && needs.evaluation.result == 'success'
    secrets: inherit
    permissions:
      contents: write
      packages: write

  build_pos_image:
    name: 🐳 بناء صورة POS
    uses: ./.github/workflows/build-pos.yaml
    needs: [syntax_check, flake_validate, evaluation]
    if: always() && !cancelled() && needs.evaluation.result == 'success'
    secrets: inherit
    permissions:
      contents: write
      packages: write

  build_website_image:
    name: 🐳 بناء صورة Website
    uses: ./.github/workflows/build-website.yaml
    needs: [syntax_check, flake_validate, evaluation]
    if: always() && !cancelled() && needs.evaluation.result == 'success'
    secrets: inherit
    permissions:
      contents: write
      packages: write

  build_wsl_image:
    name: 🪟 بناء صورة WSL
    uses: ./.github/workflows/build-client1.yaml
    needs: [syntax_check, flake_validate, evaluation]
    if: always() && !cancelled() && needs.evaluation.result == 'success'
    secrets: inherit
    permissions:
      contents: write

  # ═══════════════════════════════════════════════════════════════
  #  المرحلة 3: التقرير
  # ═══════════════════════════════════════════════════════════════
  test_report:
    name: 📊 التقرير النهائي
    runs-on: ubuntu-latest
    needs: [syntax_check, flake_validate, evaluation, build_backend_image, build_erp_image, build_ledger_image, build_hr_image, build_pos_image, build_website_image, build_wsl_image]
    if: always()
    steps:
      - name: إنشاء التقرير
        run: |
          {
            echo "## 📊 تقرير FastFree OS"
            echo ""
            echo "| المرحلة | النتيجة |"
            echo "|---------|---------|"
            echo "| فحص النحو | ${{ needs.syntax_check.result == 'success' && '✅' || '❌' }} |"
            echo "| فحص Flake | ${{ needs.flake_validate.result == 'success' && '✅' || '❌' }} |"
            echo "| تقييم التكوينات | ${{ needs.evaluation.result == 'success' && '✅' || '❌' }} |"
            echo "| بناء Backend | ${{ needs.build_backend_image.result == 'success' && '✅' || '❌' }} |"
            echo "| بناء ERP | ${{ needs.build_erp_image.result == 'success' && '✅' || '❌' }} |"
            echo "| بناء Ledger | ${{ needs.build_ledger_image.result == 'success' && '✅' || '❌' }} |"
            echo "| بناء HR | ${{ needs.build_hr_image.result == 'success' && '✅' || '❌' }} |"
            echo "| بناء POS | ${{ needs.build_pos_image.result == 'success' && '✅' || '❌' }} |"
            echo "| بناء Website | ${{ needs.build_website_image.result == 'success' && '✅' || '❌' }} |"
            echo "| بناء WSL | ${{ needs.build_wsl_image.result == 'success' && '✅' || '❌' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

