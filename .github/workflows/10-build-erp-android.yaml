name: 10-build-erp-android

on:
  push:
    tags:
      - 'erp-v*'
  workflow_dispatch:

concurrency:
  group: build-erp-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--no-deprecation"
  APP_DIR: fastfree_erp
  APP_NAME: "FastFree ERP"
  APP_ID: com.fastfree.erp
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.11.0"
  APP_KEY: erp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Safe directory
        run: git config --global safe.directory '*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Install Capacitor dependencies
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npm install

      - name: Prepare Quasar
        working-directory: apps/${{ env.APP_DIR }}
        run: |
          mkdir -p .quasar
          echo '{"compilerOptions":{}}' > .quasar/tsconfig.json
          pnpm exec quasar prepare --silent

      - name: Build web assets
        working-directory: apps/${{ env.APP_DIR }}
        env:
          VITE_API_BASE_URL: https://backend.fastfree.cloud
        run: pnpm exec quasar build

      - name: Add Android Platform
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor
        run: npx cap sync android

      - name: Generate Keystore
        run: |
          KEYSTORE_DIR="apps/${{ env.APP_DIR }}/signing"
          KEYSTORE="$KEYSTORE_DIR/release.jks"
          mkdir -p "$KEYSTORE_DIR"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE"
            echo "Keystore decoded from secret at $KEYSTORE"
          elif [ -f "$KEYSTORE" ]; then
            echo "Keystore exists"
          else
            keytool -genkeypair \
              -alias fastfree \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE" \
              -storepass FastFree@2026 \
              -keypass FastFree@2026 \
              -dname "CN=FastFree, OU=IT, O=FastFree, L=Riyadh, ST=Riyadh, C=SA"
            echo "Keystore created (ephemeral fallback)"
          fi
          mkdir -p "apps/${{ env.APP_DIR }}/src-capacitor/android"
          cat > "$KEYSTORE_DIR/keystore.properties" <<'PROPS_EOF'
          storeFile=release.jks
          storePassword=FastFree@2026
          keyAlias=fastfree
          keyPassword=FastFree@2026
          PROPS_EOF
          cat > "apps/${{ env.APP_DIR }}/src-capacitor/android/keystore.properties" <<'PROPS_EOF'
          storeFile=../../signing/release.jks
          storePassword=FastFree@2026
          keyAlias=fastfree
          keyPassword=FastFree@2026
          PROPS_EOF
          echo "keystore.properties created"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bump versionCode and versionName
        run: |
          BUILD_GRADLE="apps/${{ env.APP_DIR }}/src-capacitor/android/app/build.gradle"
          DATE_CODE=$(date +%Y%m%d)
          DATE_NAME=$(date +%Y.%m.%d)
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$((DATE_CODE * 100 + RUN_NUM))
          VERSION_NAME="$DATE_NAME"
          echo "Bumping to versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" "$BUILD_GRADLE"
            sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
            sed -i "s/versionName '.*'/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
            echo "Patched $BUILD_GRADLE"
            grep -E "versionCode|versionName" "$BUILD_GRADLE" || true
          else
            echo "build.gradle not found at $BUILD_GRADLE (skipping patch, will be created by cap add)"
          fi

      - name: Build unsigned release APK
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          KEYSTORE="apps/${{ env.APP_DIR }}/signing/release.jks"
          UNSIGNED_APK=$(find "apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/release" -name "*.apk" | head -1)
          if [ -n "$UNSIGNED_APK" ]; then
            SIGNED_APK="apps/${{ env.APP_DIR }}/dist-apk/signed-release.apk"
            mkdir -p "apps/${{ env.APP_DIR }}/dist-apk"
            
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | head -1)
            
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks "$KEYSTORE" \
                --ks-pass pass:FastFree@2026 \
                --ks-key-alias fastfree \
                --key-pass pass:FastFree@2026 \
                "$UNSIGNED_APK"
              cp "$UNSIGNED_APK" "$SIGNED_APK"
              echo "APK signed with apksigner: $SIGNED_APK"
            else
              echo "apksigner not found, using jarsigner"
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE" \
                -storepass FastFree@2026 \
                -keypass FastFree@2026 \
                "$UNSIGNED_APK" fastfree
              cp "$UNSIGNED_APK" "$SIGNED_APK"
              echo "APK signed with jarsigner: $SIGNED_APK"
            fi
          else
            echo "No APK found to sign"
            exit 1
          fi

      - name: Build AAB for Google Play
        working-directory: apps/${{ env.APP_DIR }}/src-capacitor/android
        run: gradle bundleRelease

      - name: Collect APK
        run: |
          mkdir -p apps/${{ env.APP_DIR }}/dist-apk
          if [ -f "apps/${{ env.APP_DIR }}/dist-apk/signed-release.apk" ]; then
            echo "Signed APK ready"
          elif [ -f "apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk apps/${{ env.APP_DIR }}/dist-apk/fastfree-erp.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fastfree-erp-apk
          path: apps/${{ env.APP_DIR }}/dist-apk/signed-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_ID }}-aab
          path: apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/639480735306/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: fastfree-play-publisher@fastfree-508417.iam.gserviceaccount.com
          token_format: access_token
          audience: https://www.googleapis.com/auth/androidpublisher

      - name: Publish to Play Store (Listing + AAB)
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ -z "$PLAY_ACCESS_TOKEN" ]; then
            echo "WIF authentication failed - skipping Play upload"
            exit 0
          fi
          echo "Installing googleapis..."
          npm install --prefix scripts googleapis --no-audit --no-fund --silent 2>/dev/null || true

          VERSION_CODE=$(($(date +%Y%m%d) * 100 + ${{ github.run_number }}))
          export VERSION_CODE
          echo "Using versionCode=$VERSION_CODE"

          echo "Generating metadata from products.ts..."
          node scripts/generate-metadata.mjs --app fastfree_erp

          echo "Generating feature graphics..."
          node scripts/generate-feature-graphics.mjs --app erp

          AAB_PATH=$(find apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "No AAB found - skipping Play upload"
            exit 0
          fi

          META_DIR="apps/${{ env.APP_DIR }}/fastlane/metadata/android"
          echo "=== Publishing to Play (ar, en-US) ==="
          node scripts/play-publisher.mjs \
            --package "${{ env.APP_ID }}" \
            --locales ar,en-US \
            --metadata-dir "$META_DIR" \
            --track internal \
            --aab "$AAB_PATH" \
            --status draft \
            --version-code "$VERSION_CODE"
          echo "=== Play Store publish complete ==="

      - name: Capture screenshots with Maestro
        if: env.PLAY_ACCESS_TOKEN != ''
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FF_ADMIN_USR: Administrator
          FF_ADMIN_PWD: ${{ secrets.FASTFREE_ADMIN_PASSWORD }}
        run: |
          APK=$(find apps/${{ env.APP_DIR }}/src-capacitor/android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No debug APK found - skipping screenshots"
            exit 0
          fi
          
          echo "Installing Maestro..."
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          
          # Install debug APK on emulator (if available)
          if adb devices | grep -q emulator; then
            adb install -r "$APK"
            
            # Arabic screenshots
            adb shell settings put system system_locales ar-EG
            adb shell am force-stop ${{ env.APP_ID }}
            sleep 2
            maestro test .maestro/${{ env.APP_KEY }}/ar.yaml || true
            
            # English screenshots
            adb shell settings put system system_locales en-US
            adb shell am force-stop ${{ env.APP_ID }}
            sleep 2
            maestro test .maestro/${{ env.APP_KEY }}/en.yaml || true
            
            echo "Screenshots captured"
          else
            echo "No emulator available - skipping screenshots"
          fi

      - name: Crop screenshots
        if: env.PLAY_ACCESS_TOKEN != ''
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          npm install --prefix scripts sharp --no-audit --no-fund 2>/dev/null || true
          if [ -d ".maestro/${{ env.APP_KEY }}" ]; then
            find .maestro/${{ env.APP_KEY }} -name "*.png" -exec mv {} apps/${{ env.APP_DIR }}/fastlane/metadata/android/en-US/images/phone-screenshots/ \; 2>/dev/null || true
            node scripts/crop-screenshots.mjs ${{ env.APP_KEY }} en-US || true
          fi

      - name: Commit screenshots
        if: env.PLAY_ACCESS_TOKEN != ''
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "apps/${{ env.APP_DIR }}/fastlane/metadata/android/*/images/phone-screenshots/*.png"
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "screenshots(${{ env.APP_KEY }}): refresh Play store captures"
            git push HEAD:master
          fi

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Safe directory
        run: git config --global safe.directory '*'

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: fastfree-erp-apk
          path: release

      - name: Rename APK for release
        run: mv release/signed-release.apk release/fastfree-erp.apk

      - name: Get version
        id: version
        run: |
          VERSION=$(date +%Y.%m.%d)-$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: erp-v${{ steps.version.outputs.version }}
          name: "FastFree ERP v${{ steps.version.outputs.version }}"
          files: release/fastfree-erp.apk
          generate_release_notes: true





