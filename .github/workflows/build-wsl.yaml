###############################################################################
# بناء صورة WSL — FastFree OS for Windows Subsystem for Linux
###############################################################################

name: build-wsl

on:
  push:
    branches: [main, master]
    paths:
      - "apps/fastfree_os/**"
      - ".github/workflows/build-wsl.yaml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-wsl-${{ github.ref }}
  cancel-in-progress: true

env:
  WSL_CLIENT: client1
  WSL_TARBALL: fastfree_client1.wsl
  WSL_ARCHIVE: fastfree_client1.wsl.7z

jobs:
  build-wsl:
    name: 🪟 بناء صورة WSL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build WSL tarball builder
        working-directory: apps/fastfree_os
        run: |
          echo "🏗️ Building WSL tarball for ${{ env.WSL_CLIENT }}..."
          nix build .#packages.x86_64-linux.${{ env.WSL_CLIENT }} \
            --print-build-logs --no-update-lock-file
          echo "✅ WSL tarball builder built"

      - name: Create WSL tarball
        working-directory: apps/fastfree_os
        run: |
          echo "📦 Creating WSL tarball..."
          chmod +x ./result/bin/nixos-wsl-tarball-builder
          ./result/bin/nixos-wsl-tarball-builder ${{ env.WSL_TARBALL }}
          echo "✅ WSL tarball created"
          ls -lh ${{ env.WSL_TARBALL }}

      - name: Compress WSL tarball (7z)
        working-directory: apps/fastfree_os
        run: |
          echo "🗜️ Compressing WSL tarball..."
          sudo apt-get update && sudo apt-get install -y p7zip-full
          7z a -t7z -m0=lzma2 -mx=9 -p"FastOS@2026" -mhe=on \
            ${{ env.WSL_ARCHIVE }} ${{ env.WSL_TARBALL }}
          echo "✅ WSL archive created"
          ls -lh ${{ env.WSL_ARCHIVE }}
          echo "📊 SIZE=$(stat --printf='%s' ${{ env.WSL_ARCHIVE }})" >> "$GITHUB_ENV"

      - name: Upload WSL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WSL_ARCHIVE }}
          path: apps/fastfree_os/${{ env.WSL_ARCHIVE }}
          retention-days: 30

  release:
    needs: [build-wsl]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download WSL artifact
        uses: actions/download-artifact@v4
        with:
          name: fastfree_client1.wsl.7z

      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "wsl-v1.0.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT=1
          else
            CURR=${LATEST_TAG#wsl-v1.0.}
            NEXT=$((CURR + 1))
          fi
          echo "tag=wsl-v1.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "Version: wsl-v1.0.$NEXT"

      - name: Create tag and push
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: fastfree_client1.wsl.7z

      - name: Print install instructions
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════════"
          echo "  🪟 FastFree OS — WSL Installation"
          echo "══════════════════════════════════════════════════════════════"
          echo ""
          echo "  1. Download: fastfree_client1.wsl.7z"
          echo "  2. Extract:"
          echo "     7z x fastfree_client1.wsl.7z -pFastOS@2026"
          echo "  3. Import:"
          echo "     wsl --import fastfree D:\\fastfree\\fastos fastfree_client1.wsl --version 2"
          echo "  4. Login:"
          echo "     wsl -d fastfree"
          echo ""
          echo "══════════════════════════════════════════════════════════════"
