name: build-ledger

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/fastfree_ledger/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/fastfree_ledger/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-ledger-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fastfree_ledger

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Skip postinstall for fastfree_ledger during initial install
          # quasar prepare will run separately below
          PNPM_SKIP_POSTINSTALL: ""

      - name: Prepare Quasar
        working-directory: apps/fastfree_ledger
        run: pnpm exec quasar prepare --silent || true

      - name: TypeScript check
        working-directory: apps/fastfree_ledger
        run: pnpm exec vue-tsc --noEmit

      - name: Lint check
        working-directory: apps/fastfree_ledger
        run: pnpm run lint:check

  build-frontend:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Build frontend image
        working-directory: apps/fastfree_ledger
        run: nix build .#frontendImage -o frontend-image --print-build-logs

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image (latest)
        working-directory: apps/fastfree_ledger
        run: |
          ./frontend-image | skopeo copy \
            docker-archive:/dev/stdin \
            docker://${{ env.IMAGE_PREFIX }}:latest

      - name: Push frontend image (sha)
        working-directory: apps/fastfree_ledger
        run: |
          ./frontend-image | skopeo copy \
            docker-archive:/dev/stdin \
            docker://${{ env.IMAGE_PREFIX }}:${{ github.sha }}

  release:
    needs: [build-frontend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v1.0.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT=1
          else
            CURR=${LATEST_TAG#v1.0.}
            NEXT=$((CURR + 1))
          fi
          echo "tag=v1.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "Version: v1.0.$NEXT"

      - name: Create tag and push
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
