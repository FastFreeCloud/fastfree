name: build-ledger

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-ledger-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fastfreecloud/fastfree_ledger

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.11.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Clear pnpm cache
        run: pnpm store prune

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          PNPM_SKIP_POSTINSTALL: ""

      - name: Prepare Quasar
        working-directory: apps/fastfree_ledger
        run: |
          mkdir -p .quasar
          echo '{"compilerOptions":{}}' > .quasar/tsconfig.json
          pnpm exec quasar prepare --silent

      - name: TypeScript check
        working-directory: apps/fastfree_ledger
        run: pnpm exec vue-tsc --noEmit

      - name: Lint check
        working-directory: apps/fastfree_ledger
        run: pnpm run lint:check

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Build frontend image
        working-directory: apps/fastfree_ledger
        run: nix build .#frontendImage -o frontend-image --print-build-logs

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure GHCR package exists
        continue-on-error: true
        run: |
          PKG="fastfree_ledger"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${PKG}")
          if [ "$HTTP_CODE" = "404" ]; then
            echo "Package not found — creating as public..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${PKG}" \
              -d '{"visibility": "public"}' || echo "create failed — may already exist"
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "Package exists"
          else
            echo "Unexpected response: $HTTP_CODE"
          fi

      - name: Save frontend image to tarball
        working-directory: apps/fastfree_ledger
        run: ./frontend-image > frontend-image.tar

      - name: Push frontend image (latest)
        working-directory: apps/fastfree_ledger
        env:
          SKOPEO_DEST_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo copy \
            --dest-creds "$SKOPEO_DEST_CREDS" \
            docker-archive:frontend-image.tar \
            docker://${{ env.IMAGE_PREFIX }}:latest

      - name: Push frontend image (sha)
        working-directory: apps/fastfree_ledger
        env:
          SKOPEO_DEST_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo copy \
            --dest-creds "$SKOPEO_DEST_CREDS" \
            docker-archive:frontend-image.tar \
            docker://${{ env.IMAGE_PREFIX }}:${{ github.sha }}

  release:
    needs: [lint-and-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Safe directory
        run: git config --global safe.directory '*'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "ledger-v1.0.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT=1
          else
            CURR=${LATEST_TAG#ledger-v1.0.}
            NEXT=$((CURR + 1))
          fi
          echo "tag=ledger-v1.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "Version: ledger-v1.0.$NEXT"

      - name: Create tag and push
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true


