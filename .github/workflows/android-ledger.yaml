name: "Android: FastFree Ledger"

on:
  push:
    tags:
      - 'ledger-v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track'
        required: false
        type: choice
        default: 'internal'
        options:
          - 'internal'
          - 'production'

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    uses: ./.github/workflows/android-pipeline.yaml
    with:
      app_name: 'FastFree Ledger'
      app_key: 'ledger'
      app_dir: 'apps/fastfree_ledger'
      package_id: 'com.fastfree.ledger'
      track: ${{ inputs.track }}
    secrets: inherit
