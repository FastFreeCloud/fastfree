name: "android-pipeline"

# Reusable Enterprise Pipeline for FastFree Android Mobile Releases:
#   - POS (com.fastfree.pos)
#   - ERP (com.fastfree.erp)
#   - Ledger (com.fastfree.ledger)
#   - HR (com.fastfree.hr)
#
# Clean, hermetic, keyless WIF authentication with Google Cloud & Play Store.
# Zero Flox, official actions, and automated Play publishing.

on:
  workflow_call:
    inputs:
      app_name:
        description: "Human-readable app name (e.g. FastFree POS)"
        required: true
        type: string
      app_key:
        description: "Application key identifier (pos, erp, ledger, hr)"
        required: true
        type: string
      app_dir:
        description: "App directory path (e.g. apps/fastfree_pos)"
        required: true
        type: string
      package_id:
        description: "Android package identifier (e.g. com.fastfree.pos)"
        required: true
        type: string
      track:
        description: "Google Play release track (internal, closed, production)"
        required: false
        type: string
        default: "internal"

jobs:
  build-and-publish:
    name: "Build & Publish: ${{ inputs.app_name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: "3. Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "4. Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false

      - name: "5. Setup Java 21 (Temurin)"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: "6. Setup Python uv"
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "7. Install Monorepo Dependencies"
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: "8. Install Capacitor Dependencies"
        run: |
          if [ -d "${{ inputs.app_dir }}/src-capacitor" ]; then
            cd "${{ inputs.app_dir }}/src-capacitor" && npm install
          fi

      - name: "9. Prepare Quasar Project"
        run: |
          cd "${{ inputs.app_dir }}"
          pnpm exec quasar prepare

      - name: "10. Build Quasar Web Assets"
        run: |
          cd "${{ inputs.app_dir }}"
          pnpm exec quasar build -m capacitor -T android

      - name: "11. Initialize & Sync Capacitor Android"
        run: |
          cd "${{ inputs.app_dir }}/src-capacitor"
          if [ ! -d "android" ]; then
            echo "Adding Android platform to ${{ inputs.app_name }}..."
            npx cap add android
          fi
          npx cap sync android

      - name: "12. Wire Canonical Keystore & Pin Target SDK 36"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          uv sync --locked --project scripts/fastfree-android
          uv run --project scripts/fastfree-android scripts/fastfree-android/fastfree_android_keystore.py --wire --app-dir "${{ inputs.app_key }}"

      - name: "13. Grant Execute Permission to Gradle Wrapper"
        run: |
          chmod +x "${{ inputs.app_dir }}/src-capacitor/android/gradlew"

      - name: "13b. Bump versionCode and versionName in build.gradle"
        run: |
          BUILD_GRADLE="${{ inputs.app_dir }}/src-capacitor/android/app/build.gradle"
          DATE_CODE=$(date +%Y%m%d)
          DATE_NAME=$(date +%Y.%m.%d)
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$((DATE_CODE * 100 + RUN_NUM))
          VERSION_NAME="$DATE_NAME"
          echo "Setting versionCode=$VERSION_CODE versionName=$VERSION_NAME in $BUILD_GRADLE"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" "$BUILD_GRADLE"
            sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
            sed -i "s/versionName '.*'/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
            grep -E "versionCode|versionName" "$BUILD_GRADLE" || true
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: "14. Build Android Release AAB & APK"
        run: |
          cd "${{ inputs.app_dir }}/src-capacitor/android"
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: "15. Upload Built Artifacts (AAB & APK)"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.app_key }}-android-release"
          path: |
            ${{ inputs.app_dir }}/src-capacitor/android/app/build/outputs/bundle/release/*.aab
            ${{ inputs.app_dir }}/src-capacitor/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: "16. Authenticate to Google Cloud via WIF (Keyless)"
        id: google-auth
        uses: google-github-actions/auth@v3
        continue-on-error: true
        with:
          workload_identity_provider: "projects/639480735306/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "fastfree-play-publisher@fastfree-508417.iam.gserviceaccount.com"

      - name: "17. Publish to Google Play Store"
        if: steps.google-auth.outcome == 'success'
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Google Cloud credentials unavailable - skipping Play Store upload."
            exit 0
          fi

          VERSION_CODE=$(($(date +%Y%m%d) * 100 + ${{ github.run_number }}))
          export VERSION_CODE
          echo "Computed versionCode: $VERSION_CODE"

          echo "Generating localized metadata..."
          uv run --project scripts/fastfree-android scripts/fastfree-android/fastfree_store_metadata.py --app "${{ inputs.app_key }}"

          echo "Generating feature graphics banner..."
          uv run --project scripts/fastfree-android scripts/fastfree-android/fastfree_store_graphics.py --app "${{ inputs.app_key }}"

          AAB_FILE=$(find "${{ inputs.app_dir }}/src-capacitor/android/app/build/outputs/bundle/release" -name "*.aab" | head -1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB bundle not found in build outputs!"
            exit 1
          fi

          echo "Publishing $AAB_FILE to Google Play track [${{ inputs.track }}]..."
          uv run --project scripts/fastfree-android scripts/fastfree-android/fastfree_store_publish.py \
            --package "${{ inputs.package_id }}" \
            --locales ar,en-US \
            --metadata-dir "${{ inputs.app_dir }}/fastlane/metadata/android" \
            --track "${{ inputs.track }}" \
            --aab "$AAB_FILE" \
            --status completed \
            --version-code "$VERSION_CODE"

          echo "=== Successfully published ${{ inputs.app_name }} to Google Play (${{ inputs.track }}) ==="
