name: 01-apps

# Consolidated Quasar SPA pipeline for FastFree OS apps:
#   - fastfree_ledger
#   - fastfree_erp
#   - fastfree_hr
#   - fastfree_pos
#
# Validates types, lints, and builds native SPA distribution artifacts.
# Fast, clean, hermetic Node.js 22 + pnpm pipeline.

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/fastfree_ledger/**'
      - 'apps/fastfree_erp/**'
      - 'apps/fastfree_hr/**'
      - 'apps/fastfree_pos/**'
      - 'packages/**'
      - '.github/workflows/01-apps.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/fastfree_ledger/**'
      - 'apps/fastfree_erp/**'
      - 'apps/fastfree_hr/**'
      - 'apps/fastfree_pos/**'
      - 'packages/**'
      - '.github/workflows/01-apps.yaml'
  workflow_dispatch:
    inputs:
      app:
        description: "App to validate & build (or 'all')"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - ledger
          - erp
          - hr
          - pos

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  validate-and-build:
    name: "SPA: ${{ matrix.app }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [ledger, erp, hr, pos]
    steps:
      - name: "1. Safe directory"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: actions/checkout@v4

      - name: "3. Setup Node.js 22"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "4. Setup pnpm"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: "5. Get pnpm store directory"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: "6. Setup pnpm cache"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: "7. Install dependencies"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: "8. Install Capacitor dependencies"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: |
          if [ -d "apps/fastfree_${{ matrix.app }}/src-capacitor" ]; then
            cd "apps/fastfree_${{ matrix.app }}/src-capacitor" && npm install
          fi

      - name: "9. Prepare Quasar"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: |
          cd "apps/fastfree_${{ matrix.app }}"
          pnpm exec quasar prepare

      - name: "10. TypeScript check"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: |
          cd "apps/fastfree_${{ matrix.app }}"
          pnpm exec vue-tsc --noEmit

      - name: "11. Lint check"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: |
          cd "apps/fastfree_${{ matrix.app }}"
          pnpm exec eslint -c ./eslint.config.js "./src*/**/*.{ts,js,cjs,mjs,vue}"

      - name: "12. Build Quasar SPA"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: |
          cd "apps/fastfree_${{ matrix.app }}"
          pnpm exec quasar build

      - name: "13. Upload SPA Artifact"
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app) && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: "fastfree_${{ matrix.app }}_spa"
          path: "apps/fastfree_${{ matrix.app }}/dist/spa"
          retention-days: 7
