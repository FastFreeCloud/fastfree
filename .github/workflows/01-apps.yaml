name: 01-apps

# Consolidated Quasar SPA pipeline for FastFree OS apps:
#   - fastfree_ledger
#   - fastfree_erp
#   - fastfree_hr
#   - fastfree_pos
#
# Validates types, lints, and builds native SPA distribution artifacts.
# Eliminates obsolete Podman / Docker Buildx / GHCR image push overhead.

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/fastfree_ledger/**'
      - 'apps/fastfree_erp/**'
      - 'apps/fastfree_hr/**'
      - 'apps/fastfree_pos/**'
      - 'packages/**'
      - '.github/workflows/01-apps.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/fastfree_ledger/**'
      - 'apps/fastfree_erp/**'
      - 'apps/fastfree_hr/**'
      - 'apps/fastfree_pos/**'
      - 'packages/**'
      - '.github/workflows/01-apps.yaml'
  workflow_dispatch:
    inputs:
      app:
        description: "App to validate & build (or 'all')"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - ledger
          - erp
          - hr
          - pos

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  validate-and-build:
    name: "SPA: ${{ matrix.app }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [ledger, erp, hr, pos]
    steps:
      - name: "1. Safe directory"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: actions/checkout@v6

      - name: "3. Install Flox"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: flox/install-flox-action@v2

      - name: "4. Install workspace dependencies"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: flox/activate-action@v1
        with:
          dir: .
          command: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: "5. Install Capacitor dependencies"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: flox/activate-action@v1
        with:
          dir: .
          command: |
            if [ -d "apps/fastfree_${{ matrix.app }}/src-capacitor" ]; then
              cd "apps/fastfree_${{ matrix.app }}/src-capacitor" && npm install
            fi

      - name: "6. Prepare Quasar"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: flox/activate-action@v1
        with:
          dir: .
          command: |
            cd "apps/fastfree_${{ matrix.app }}"
            mkdir -p .quasar && echo '{"compilerOptions":{}}' > .quasar/tsconfig.json
            pnpm exec quasar prepare --silent

      - name: "7. TypeScript check"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd "apps/fastfree_${{ matrix.app }}" && pnpm exec vue-tsc --noEmit

      - name: "8. Lint check"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd "apps/fastfree_${{ matrix.app }}" && pnpm exec eslint -c ./eslint.config.js "./src*/**/*.{ts,js,cjs,mjs,vue}"

      - name: "9. Build Quasar SPA"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
        uses: flox/activate-action@v1
        with:
          dir: .
          command: cd "apps/fastfree_${{ matrix.app }}" && pnpm exec quasar build

      - name: "10. Upload SPA Artifact"
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app) && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: "fastfree_${{ matrix.app }}_spa"
          path: "apps/fastfree_${{ matrix.app }}/dist/spa"
          retention-days: 7
