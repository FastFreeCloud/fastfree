name: 99-mysql-diagnostic

on:
  workflow_dispatch:

concurrency:
  group: mysql-diagnostic
  cancel-in-progress: true

jobs:
  mysql-diagnostic:
    name: "MySQL Diagnostic - client3"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: "1. site_config.json"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "cat /var/lib/containers/storage/volumes/fastfree-backend-sites/_data/backend.fastfree.cloud/site_config.json 2>/dev/null || echo 'NOT FOUND'"

      - name: "2. ALL MySQL users"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "mysql -u root -p'$SSH_PASSWORD' -e 'SELECT user, host, plugin FROM mysql.user;' 2>&1"

      - name: "3. MySQL databases"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "mysql -u root -p'$SSH_PASSWORD' -e 'SHOW DATABASES;' 2>&1"

      - name: "4. backend container env vars"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "podman exec fastfree-backend-app env 2>/dev/null | grep -iE 'DB|MYSQL|PASSWORD|FRAPPE' || echo 'Cannot exec'"

      - name: "5. backend container MySQL connectivity test"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "podman exec fastfree-backend-app env | grep -iE 'DB_|MYSQL_|FRAPPE_' || echo 'No DB env vars found'; \
             cat /var/lib/containers/storage/volumes/fastfree-backend-sites/_data/backend.fastfree.cloud/site_config.json 2>/dev/null; \
             podman exec fastfree-backend-app python3 -c 'import pymysql,json;cfg=json.load(open(\"/home/frappe/frappe-bench/sites/backend.fastfree.cloud/site_config.json\"));print(\"db_name:\",cfg.get(\"db_name\"));print(\"db_password:\",cfg.get(\"db_password\"));print(\"db_host:\",cfg.get(\"db_host\"));c=pymysql.connect(host=cfg.get(\"db_host\",\"localhost\"),user=cfg[\"db_name\"],password=cfg[\"db_password\"],database=cfg[\"db_name\"]);print(\"MySQL CONNECT: SUCCESS\");c.close()' 2>&1 || echo 'Python test failed'"

      - name: "6. frappe-bench sites directory"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "ls -la /var/lib/containers/storage/volumes/fastfree-backend-sites/_data/backend.fastfree.cloud/ 2>/dev/null | head -20"

      - name: "7. fastfree-backend-mysql-user service logs"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "journalctl -u fastfree-backend-mysql-user.service --no-pager -n 30 2>&1"

      - name: "8. MariaDB error log"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "journalctl -u mysql --no-pager -n 20 2>&1 | grep -i 'error\|denied\|failed' || echo 'No errors'"

      - name: "9. MySQL reachability from backend container"
        env:
          SSH_PASSWORD: ${{ secrets.CLIENT3_ROOT_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@${{ secrets.CLIENT3_IP }} \
            "podman exec fastfree-backend-app mysql -h host.containers.internal -u root -p'$SSH_PASSWORD' -e 'SELECT 1;' 2>&1 || echo 'MySQL not reachable from container'"
