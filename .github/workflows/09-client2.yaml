###############################################################################
# Client2 pipeline — validate + build Hyper-V VHDX image
# Replaces: 13-validate-os.yaml (client2 leg) + 15-build-client2.yaml
###############################################################################

name: 09-client2

on:
  workflow_dispatch:

concurrency:
  group: client2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "1. Validate client2 config"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "1. Safe directory"
        run: git config --global safe.directory '*'

      - name: "2. Checkout"
        uses: actions/checkout@v6

      - name: "3. Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: "4. Parse Nix files"
        working-directory: apps/fastfree_os
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! nix-instantiate --parse "$file" >/dev/null 2>&1; then
              echo "SYNTAX ERROR: $file"
              FAILED=1
            fi
          done < <(find . -name "*.nix" -not -path "./.git/*" -print0 | sort -z)
          [ "$FAILED" -eq 0 ] && echo "All Nix files parse OK" || exit 1
        shell: bash

      - name: "5. Evaluate client2 toplevel"
        working-directory: apps/fastfree_os
        run: nix eval --extra-experimental-features 'nix-command flakes' ".#nixosConfigurations.client2.config.system.build.toplevel" --no-update-lock-file --print-build-logs >/dev/null && echo "client2 evaluates OK"
        shell: bash

  build-hyperv:
    name: "2. Build Hyper-V image"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: "1. Free disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af --filter "until=24h"
          echo "Disk space after cleanup: $(df -h / | tail -1 | awk '{print $4}')"
        shell: bash

      - name: "2. Safe directory"
        run: git config --global safe.directory '*'

      - name: "3. Checkout"
        uses: actions/checkout@v6

      - name: "4. Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: "5. Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: "6. Build Hyper-V VHDX image"
        working-directory: apps/fastfree_os
        run: |
          echo "Building Hyper-V VHDX for client2..."
          nix build .#packages.x86_64-linux.client2 \
            --print-build-logs --no-update-lock-file --extra-experimental-features 'nix-command flakes'
          echo "Hyper-V VHDX built"
          ls -lh result/

      - name: "7. Upload Hyper-V artifact"
        uses: actions/upload-artifact@v7
        with:
          name: fastfree_client2.vhdx.7z
          path: apps/fastfree_os/result/fastfree_client2.vhdx.7z
          retention-days: 30
