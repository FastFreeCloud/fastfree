appId: com.fastfree.ledger
env:
  ADMIN_USER: ${FF_ADMIN_USR}
  ADMIN_PASS: ${FF_ADMIN_PWD}
config:
  androidWebViewHierarchy: devtools

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'أدخل عنوان الخادم\.\.\.'
    timeout: 10000

- runFlow:
    when:
      visible: 'أدخل عنوان الخادم\.\.\.'
    commands:
      - tapOn: 'أدخل عنوان الخادم\.\.\.'
      - eraseText: 1
      - inputText: "https://backend.fastfree.cloud"
      - tapOn: "اتصال"

- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible: "المصادقة"
    timeout: 20000

- tapOn: "المصادقة"

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: "تسجيل الدخول"
    index: 0

- extendedWaitUntil:
    visible: "البريد الإلكتروني"
    timeout: 10000

- tapOn: "البريد الإلكتروني"
- eraseText: 1
- inputText: "${ADMIN_USER}"

- tapOn: "كلمة المرور"
- eraseText: 1
- inputText: "${ADMIN_PASS}"

- tapOn:
    text: "دخول"
    index: 1

- extendedWaitUntil:
    visible: "المصادقة"
    timeout: 30000

- waitForAnimationToEnd:
    timeout: 5000

# 01 – لوحة معلومات المحاسبة
- tapOn: "المحاسبة"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "لوحة معلومات المحاسبة"
- extendedWaitUntil:
    visible: "إجمالي الحسابات"
    timeout: 15000
- takeScreenshot:
    path: 01-dashboard

# 02 – شجرة الحسابات
- tapOn: "المحاسبة"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "شجرة الحسابات"
- extendedWaitUntil:
    visible: "اسم الحساب"
    timeout: 15000
- takeScreenshot:
    path: 02-chart-of-accounts

# 03 – القيود اليومية
- tapOn: "المحاسبة"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "القيود اليومية"
- extendedWaitUntil:
    visible: "تاريخ الترحيل"
    timeout: 15000
- takeScreenshot:
    path: 03-journal

# 04 – قيود الدفع
- tapOn: "المحاسبة"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "قيود الدفع"
- extendedWaitUntil:
    visible: "الطرف"
    timeout: 15000
- takeScreenshot:
    path: 04-payment

# 05 – دفتر الأستاذ العام
- tapOn: "المحاسبة"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "دفتر الأستاذ العام"
- extendedWaitUntil:
    visible: "الحساب"
    timeout: 15000
- takeScreenshot:
    path: 05-ledger

# 06 – التقارير المالية
- tapOn: "المحاسبة"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "التقارير المالية"
- extendedWaitUntil:
    visible: "نوع التقرير"
    timeout: 15000
- takeScreenshot:
    path: 06-reports
