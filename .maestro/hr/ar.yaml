appId: com.fastfree.hr
env:
  ADMIN_USER: ${FF_ADMIN_USR}
  ADMIN_PASS: ${FF_ADMIN_PWD}
config:
  androidWebViewHierarchy: devtools

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'أدخل عنوان الخادم\.\.\.'
    timeout: 10000

- runFlow:
    when:
      visible: 'أدخل عنوان الخادم\.\.\.'
    commands:
      - tapOn: 'أدخل عنوان الخادم\.\.\.'
      - eraseText: 1
      - inputText: "https://backend.fastfree.cloud"
      - tapOn: "اتصال"

- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible: "المصادقة"
    timeout: 20000

- tapOn: "المصادقة"

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: "تسجيل الدخول"
    index: 0

- extendedWaitUntil:
    visible: "البريد الإلكتروني"
    timeout: 10000

- tapOn: "البريد الإلكتروني"
- eraseText: 1
- inputText: "${ADMIN_USER}"

- tapOn: "كلمة المرور"
- eraseText: 1
- inputText: "${ADMIN_PASS}"

- tapOn:
    text: "دخول"
    index: 1

- extendedWaitUntil:
    visible: "المصادقة"
    timeout: 30000

- waitForAnimationToEnd:
    timeout: 5000

# 01 – الموظفون
- tapOn: "الموارد البشرية"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "الموظفون"
- extendedWaitUntil:
    visible: "اسم الموظف"
    timeout: 15000
- takeScreenshot:
    path: 01-employees

# 02 – الأقسام
- tapOn: "الموارد البشرية"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "الأقسام"
- extendedWaitUntil:
    visible: "اسم القسم"
    timeout: 15000
- takeScreenshot:
    path: 02-departments

# 03 – المسميات الوظيفية
- tapOn: "الموارد البشرية"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "المسميات الوظيفية"
- extendedWaitUntil:
    visible: "اسم المسمى"
    timeout: 15000
- takeScreenshot:
    path: 03-designations

# 04 – الحضور والانصراف
- tapOn: "الموارد البشرية"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "الحضور والانصراف"
- extendedWaitUntil:
    visible: "تاريخ الحضور"
    timeout: 15000
- takeScreenshot:
    path: 04-attendance

# 05 – طلبات الإجازة
- tapOn: "الموارد البشرية"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "طلبات الإجازة"
- extendedWaitUntil:
    visible: "نوع الإجازة"
    timeout: 15000
- takeScreenshot:
    path: 05-leave-applications

# 06 – كشوف الرواتب
- tapOn: "الموارد البشرية"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "كشوف الرواتب"
- extendedWaitUntil:
    visible: "الراتب الأساسي"
    timeout: 15000
- takeScreenshot:
    path: 06-salary-slips
