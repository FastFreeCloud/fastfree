appId: com.fastfree.hr
env:
  ADMIN_USER: ${FF_ADMIN_USR}
  ADMIN_PASS: ${FF_ADMIN_PWD}
config:
  androidWebViewHierarchy: devtools

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'Enter server URL\.\.\.'
    timeout: 10000

- runFlow:
    when:
      visible: 'Enter server URL\.\.\.'
    commands:
      - tapOn: 'Enter server URL\.\.\.'
      - eraseText: 1
      - inputText: "https://backend.fastfree.cloud"
      - tapOn: "Connect"

- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible: "Authentication"
    timeout: 20000

- tapOn: "Authentication"

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: "Login"
    index: 0

- extendedWaitUntil:
    visible: "Email"
    timeout: 10000

- tapOn: "Email"
- eraseText: 1
- inputText: "${ADMIN_USER}"

- tapOn: "Password"
- eraseText: 1
- inputText: "${ADMIN_PASS}"

- tapOn:
    text: "Login"
    index: 1

- extendedWaitUntil:
    visible: "Authentication"
    timeout: 30000

- waitForAnimationToEnd:
    timeout: 5000

# 01 – Employees
- tapOn: "Human Resources"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Employees"
- extendedWaitUntil:
    visible: "Employee Name"
    timeout: 15000
- takeScreenshot:
    path: 01-employees

# 02 – Departments
- tapOn: "Human Resources"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Departments"
- extendedWaitUntil:
    visible: "Department Name"
    timeout: 15000
- takeScreenshot:
    path: 02-departments

# 03 – Designations
- tapOn: "Human Resources"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Designations"
- extendedWaitUntil:
    visible: "Designation Name"
    timeout: 15000
- takeScreenshot:
    path: 03-designations

# 04 – Attendance
- tapOn: "Human Resources"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Attendance"
- extendedWaitUntil:
    visible: "Attendance Date"
    timeout: 15000
- takeScreenshot:
    path: 04-attendance

# 05 – Leave Applications
- tapOn: "Human Resources"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Leave Applications"
- extendedWaitUntil:
    visible: "Leave Type"
    timeout: 15000
- takeScreenshot:
    path: 05-leave-applications

# 06 – Salary Slips
- tapOn: "Human Resources"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Salary Slips"
- extendedWaitUntil:
    visible: "Basic Salary"
    timeout: 15000
- takeScreenshot:
    path: 06-salary-slips
